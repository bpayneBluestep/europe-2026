<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Europe 2026</title>
<meta name="description" content="Offline trip companion — Rome, Venice, Lake Como, Interlaken, Paris.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5f6f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Europe 26">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  /* Instrument Sans, self-hosted so the app still renders offline. */
  @font-face{
    font-family:'Instrument Sans'; font-style:normal; font-weight:400 700;
    font-display:swap; src:url(fonts/instrument-sans-latin.woff2) format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
      U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,
      U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:'Instrument Sans'; font-style:normal; font-weight:400 700;
    font-display:swap; src:url(fonts/instrument-sans-latin-ext.woff2) format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,
      U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,
      U+2113,U+2C60-2C7F,U+A720-A7FF;
  }

  :root{
    --ink:#212529;
    --bg:#f5f6f7;
    --card:#ffffff;
    --dim:#6c727a;
    --faint:#9aa0a6;
    --line:#ecedef;
    --sunk:#eceef0;
    --alert:#b42318;
    --alert-bg:#fef3f2;
    --r-lg:24px;
    --r-md:18px;
    --r-sm:13px;
    --shadow:0 1px 2px rgba(33,37,41,.04), 0 8px 24px rgba(33,37,41,.05);
    --nav-h:calc(72px + env(safe-area-inset-bottom));
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px; line-height:1.5; letter-spacing:-.005em;
    padding-bottom:var(--nav-h);
    -webkit-text-size-adjust:100%; overscroll-behavior-y:none;
  }
  a{color:inherit}
  ::-webkit-scrollbar{display:none}

  main{
    max-width:560px; margin:0 auto;
    padding:calc(18px + env(safe-area-inset-top)) 20px 28px;
  }

  /* ---------- type ---------- */
  .greet{font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.15;margin:0}
  .greet-sub{font-size:14px;color:var(--dim);margin:5px 0 0}
  .sect{display:flex;align-items:baseline;justify-content:space-between;
    margin:26px 0 12px;gap:12px}
  .sect h2{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0}
  .sect a,.sect button.link{font-size:13.5px;color:var(--ink);text-decoration:underline;
    text-underline-offset:3px;background:none;border:0;font:inherit;padding:0;cursor:pointer}
  .lead{font-size:15px;color:var(--dim);margin:0 0 10px}
  .lead:last-child{margin-bottom:0}
  .label{font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--faint);
    text-transform:uppercase}
  .mono{font-variant-numeric:tabular-nums;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.02em}

  /* ---------- cards ---------- */
  .card{background:var(--card);border-radius:var(--r-lg);padding:18px;
    margin-bottom:12px;box-shadow:var(--shadow)}
  .card.pad-sm{padding:15px 17px}
  .card:last-child{margin-bottom:0}

  /* Hero. Solid ink by default; add .photo + a --bg-img and the photograph
     carries the colour, with a scrim so white type stays legible over it. */
  .hero{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:22px;
    margin-bottom:14px;position:relative;overflow:hidden;isolation:isolate}
  .hero.photo{background:var(--accent,var(--ink));min-height:238px;
    display:flex;flex-direction:column;justify-content:flex-end;padding:20px}
  .hero.photo::before{content:"";position:absolute;inset:0;z-index:-2;
    background-image:var(--bg-img);background-size:cover;background-position:center}
  /* Scrim: almost nothing over the top two-thirds so the photograph keeps its
     colour, deepening to the city's accent only where the type sits. */
  .hero.photo::after{content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(178deg,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,.10) 38%,
      color-mix(in srgb, var(--accent,#212529) 40%, rgba(0,0,0,.55)) 76%,
      color-mix(in srgb, var(--accent,#212529) 52%, rgba(0,0,0,.80)) 100%)}
  .hero .label{color:rgba(255,255,255,.72)}
  .hero.photo h1,.hero.photo p{text-shadow:0 1px 12px rgba(0,0,0,.35)}
  .hero h1{font-size:27px;font-weight:700;letter-spacing:-.028em;line-height:1.16;
    margin:9px 0 6px}
  .hero p{font-size:14px;color:rgba(255,255,255,.7);margin:0}
  .hero .cta{display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-top:20px;background:rgba(255,255,255,.1);border-radius:999px;
    padding:7px 8px 7px 20px;border:0;width:100%;font:inherit;color:#fff;cursor:pointer;
    text-align:left}
  .hero .cta span{font-size:14.5px;font-weight:600}
  .hero .cta i{flex:0 0 36px;height:36px;border-radius:999px;background:#fff;
    display:grid;place-items:center;font-style:normal}
  .hero .cta i svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .hero .count{font-size:52px;font-weight:700;letter-spacing:-.04em;line-height:1;
    margin:10px 0 4px;font-variant-numeric:tabular-nums}

  /* ---------- circular buttons ---------- */
  .circ{width:42px;height:42px;border-radius:999px;background:var(--card);border:0;
    display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);
    flex:0 0 42px;padding:0;color:var(--ink)}
  .circ svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}

  /* ---------- detail header ---------- */
  .dhead{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .dhead .mid{flex:1;min-width:0;text-align:center}
  .dhead .mid b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dhead .mid span{display:block;font-size:12.5px;color:var(--dim);margin-top:1px}
  .dhead .spacer{flex:0 0 42px}

  /* ---------- chips ---------- */
  .chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 16px;padding:2px 20px 4px;
    scrollbar-width:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);
    color:var(--ink);border-radius:999px;padding:9px 17px;font:inherit;font-size:13.5px;
    font-weight:500;cursor:pointer;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);
    font-weight:600}

  /* ---------- accordion / list rows ---------- */
  .acc{background:var(--card);border-radius:var(--r-lg);margin-bottom:10px;
    box-shadow:var(--shadow);overflow:hidden}
  .acc>summary{display:flex;align-items:center;gap:14px;padding:14px;cursor:pointer;
    list-style:none}
  .acc>summary::-webkit-details-marker{display:none}
  .acc .thumb{flex:0 0 54px;height:54px;border-radius:var(--r-sm);background:var(--ink);
    color:#fff;display:grid;place-items:center;font-size:19px;font-weight:700;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums;position:relative;
    overflow:hidden;isolation:isolate}
  .acc .thumb.soft{background:var(--sunk);color:var(--accent,var(--ink))}
  /* Without this an icon inside an accordion thumb renders as a filled blob. */
  .acc .thumb svg{width:21px;height:21px;stroke:currentColor;fill:none;
    stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
  /* Photo thumbnail: the day number sits on the picture, tinted by the city. */
  .acc .thumb.pic{background-image:var(--bg-img);background-size:cover;
    background-position:center;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  /* Darken behind the numeral only, so the picture stays vivid at the edges. */
  .acc .thumb.pic::before{content:"";position:absolute;inset:0;z-index:-1;
    background:
      radial-gradient(circle at 50% 52%, rgba(0,0,0,.62) 0%, rgba(0,0,0,.10) 74%),
      color-mix(in srgb, var(--accent,#212529) 14%, transparent)}
  .acc .txt{flex:1;min-width:0}
  .acc .txt .label{display:block;margin-bottom:2px}
  .acc .txt b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.015em;
    line-height:1.3}
  .acc .txt em{display:block;font-style:normal;font-size:12.5px;color:var(--faint);
    margin-top:2px}
  .acc .chev{flex:0 0 20px;color:var(--faint);transition:transform .18s ease}
  .acc .chev svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round;display:block}
  .acc[open] .chev{transform:rotate(180deg)}
  .acc .inner{padding:0 18px 18px}

  /* tappable list card (no accordion) */
  .item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:var(--card);border:0;border-radius:var(--r-lg);padding:14px;
    margin-bottom:10px;box-shadow:var(--shadow);font:inherit;color:inherit;cursor:pointer}
  .item .thumb{flex:0 0 54px;height:54px;border-radius:var(--r-sm);background:var(--sunk);
    display:grid;place-items:center}
  .item .thumb svg{width:21px;height:21px;stroke:var(--ink);fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .item .thumb.dark{background:var(--ink)}
  .item .thumb.dark svg{stroke:#fff}
  .item .txt{flex:1;min-width:0}
  .item .txt b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.015em;
    line-height:1.3}
  .item .txt em{display:block;font-style:normal;font-size:12.5px;color:var(--faint);
    margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .go{flex:0 0 20px;color:var(--faint)}
  .item .go svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round;display:block}

  /* ---------- timeline (Morning / Afternoon / Evening pattern) ---------- */
  .tl{list-style:none;margin:0;padding:0}
  .tl li{padding:13px 0;border-top:1px solid var(--line)}
  .tl li:first-child{border-top:0;padding-top:2px}
  .tl .t{font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--faint);
    text-transform:uppercase;font-variant-numeric:tabular-nums}
  .tl b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.015em;
    margin-top:4px;line-height:1.32}
  .tl span{display:block;font-size:14px;color:var(--dim);margin-top:5px;line-height:1.45}

  /* ---------- key/value rows ---------- */
  .kv{padding:12px 0;border-top:1px solid var(--line)}
  .kv:first-child{border-top:0;padding-top:0}
  .kv .k{font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--faint);
    text-transform:uppercase}
  .kv .v{font-size:15px;margin-top:4px;line-height:1.4;word-break:break-word}
  .kv .v a{text-decoration:underline;text-underline-offset:3px}

  /* ---------- notes ---------- */
  .note{border-radius:var(--r-md);padding:15px 17px;font-size:14.5px;line-height:1.5;
    margin-bottom:12px;background:var(--sunk);color:var(--ink)}
  .note.alert{background:var(--alert-bg);color:var(--alert);font-weight:500}
  .note .label{display:block;margin-bottom:6px}
  .note.alert .label{color:var(--alert);opacity:.7}

  /* ---------- city colour accents ---------- */
  .dot{display:inline-block;width:9px;height:9px;border-radius:999px;
    background:var(--accent,var(--ink));margin-right:8px;vertical-align:middle;
    position:relative;top:-1px}
  .chip .dot{width:7px;height:7px;margin-right:7px}
  .chip[aria-pressed="true"] .dot{background:#fff}
  .sect h2 .dot{width:10px;height:10px}
  /* A tinted rule under a city's section, so the colour reads without shouting. */
  .accent-rule{height:3px;border-radius:2px;background:var(--accent,var(--ink));
    width:34px;margin:-4px 0 14px}
  .tl .t{color:var(--accent,var(--faint))}
  .kv .k{color:var(--accent,var(--faint));opacity:.85}

  /* photo banner used on stay cards */
  .banner{height:150px;border-radius:var(--r-md);background-image:var(--bg-img);
    background-size:cover;background-position:center;margin:-4px 0 14px;
    position:relative;overflow:hidden}
  .banner::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 45%,
      color-mix(in srgb, var(--accent,#212529) 55%, rgba(0,0,0,.6)) 100%)}

  /* ---------- credits ---------- */
  .credit{font-size:12px;color:var(--faint);line-height:1.5;padding:9px 0;
    border-top:1px solid var(--line)}
  .credit:first-child{border-top:0;padding-top:0}
  .credit a{text-decoration:underline;text-underline-offset:2px}

  /* ---------- checklist ---------- */
  .check{list-style:none;margin:0;padding:0}
  .check li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;
    border-top:1px solid var(--line);font-size:14.5px}
  .check li:first-child{border-top:0;padding-top:0}
  .check li::before{content:"";flex:0 0 19px;height:19px;margin-top:1px;
    border:1.6px solid #d5d8dc;border-radius:6px}

  /* ---------- buttons ---------- */
  .btns{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:12px 20px;
    border-radius:999px;font-size:14px;font-weight:600;text-decoration:none;
    background:var(--ink);color:#fff;border:0;cursor:pointer;font-family:inherit}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn-wide{display:block;width:100%;text-align:center;padding:17px;border-radius:999px;
    background:var(--ink);color:#fff;font-size:15.5px;font-weight:600;
    text-decoration:none;margin-top:18px}

  /* ---------- QR images ---------- */
  .qr img{width:100%;max-width:290px;border-radius:var(--r-md);background:#fff;
    display:block;margin:0 auto 10px;border:1px solid var(--line)}
  .qr .missing{font-size:13.5px;color:var(--faint);background:var(--sunk);
    border-radius:var(--r-md);padding:16px;text-align:center;margin-bottom:10px}

  /* ---------- floating nav pill ---------- */
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
    padding:0 20px calc(14px + env(safe-area-inset-bottom));pointer-events:none;
  }
  nav .pill{
    pointer-events:auto;display:flex;gap:4px;background:var(--ink);border-radius:999px;
    padding:7px;box-shadow:0 6px 24px rgba(33,37,41,.22);
  }
  nav button{
    appearance:none;border:0;background:none;width:50px;height:50px;border-radius:999px;
    display:grid;place-items:center;cursor:pointer;color:rgba(255,255,255,.62);padding:0;
    transition:background .16s ease,color .16s ease;
  }
  nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round}
  nav button[aria-current="true"]{background:#fff;color:var(--ink)}

  /* SOS — always reachable, sits just above the nav pill */
  .sos{position:fixed;right:20px;bottom:calc(var(--nav-h) + 8px);z-index:39;
    width:50px;height:50px;border-radius:999px;border:0;background:var(--card);
    color:var(--alert);font:inherit;font-size:11.5px;font-weight:700;letter-spacing:.05em;
    box-shadow:0 4px 18px rgba(33,37,41,.16);cursor:pointer}
</style>
</head>
<body>

<main id="app"></main>
<nav><div class="pill" id="tabs"></div></nav>

<script src="data.js"></script>
<script src="days.js"></script>
<script>
(function(){
  "use strict";

  /* ---------- helpers ---------- */
  var E = document.createElement("div");
  function esc(s){ E.textContent = s == null ? "" : String(s); return E.innerHTML; }
  function el(id){ return document.getElementById(id); }

  var ICON = {
    home:    '<path d="M3.2 11.4 12 4l8.8 7.4"/><path d="M5.6 10.2V20h12.8v-9.8"/>',
    cal:     '<rect x="3.5" y="5.2" width="17" height="15.3" rx="3.4"/><path d="M8 3.2v3.6M16 3.2v3.6M3.5 10.2h17"/>',
    ticket:  '<path d="M3.4 8.8a2.2 2.2 0 0 1 2.2-2.2h12.8a2.2 2.2 0 0 1 2.2 2.2v.9a2.3 2.3 0 0 0 0 4.6v.9a2.2 2.2 0 0 1-2.2 2.2H5.6a2.2 2.2 0 0 1-2.2-2.2v-.9a2.3 2.3 0 0 0 0-4.6z"/><path d="M14.2 7v10" stroke-dasharray="2 2.6"/>',
    bed:     '<path d="M3.5 19v-9M3.5 14h17v5M20.5 14v-2.6a2.4 2.4 0 0 0-2.4-2.4H11V14"/><circle cx="7.2" cy="11.4" r="1.9"/>',
    checks:  '<path d="M3.5 7.6 5.4 9.5 8.9 6"/><path d="M3.5 16.1 5.4 18l3.5-3.5"/><path d="M12.5 8h8M12.5 17h8"/>',
    chevD:   '<path d="M6 9.5 12 15.5 18 9.5"/>',
    chevR:   '<path d="M9.5 5.5 16 12l-6.5 6.5"/>',
    chevL:   '<path d="M14.5 5.5 8 12l6.5 6.5"/>',
    arrowR:  '<path d="M4.5 12h15M13.5 6l6 6-6 6"/>',
    pin:     '<path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/>',
    plane:   '<path d="M10.4 3.6a1.6 1.6 0 0 1 3.2 0V9l7.4 4.3v2.3l-7.4-2.3v4l2.6 2v1.7L12 20l-4.2 1v-1.7l2.6-2v-4L3 15.6v-2.3L10.4 9z"/>',
    train:   '<rect x="5" y="3.6" width="14" height="13" rx="3.4"/><path d="M5 11h14M8.5 20.4 6.6 16.6M15.5 20.4l1.9-3.8"/><circle cx="8.8" cy="13.8" r=".9"/><circle cx="15.2" cy="13.8" r=".9"/>',
    car:     '<path d="M4 16.4v2.2h2.6v-2.2M17.4 16.4v2.2H20v-2.2"/><path d="M3.6 16.4v-4l1.9-4.6A2 2 0 0 1 7.4 6.6h9.2a2 2 0 0 1 1.9 1.2l1.9 4.6v4z"/><path d="M3.6 12.4h16.8"/><circle cx="7.4" cy="14.4" r=".9"/><circle cx="16.6" cy="14.4" r=".9"/>',
    star:    '<path d="M12 3.8l2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/>',
    fork:    '<path d="M6.5 3v6.5a2.5 2.5 0 0 0 5 0V3M9 9.5V21"/><path d="M17 21V3c-2 .8-2.8 3-2.8 5.6 0 1.8.9 2.8 2.8 3"/>',
    camera:  '<path d="M3.5 8.6a2 2 0 0 1 2-2h1.9l1.3-2.1h6.6l1.3 2.1h1.9a2 2 0 0 1 2 2v8.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.8" r="3.4"/>'
  };
  function svg(name, cls){
    return '<svg viewBox="0 0 24 24"' + (cls ? ' class="' + cls + '"' : '') + '>' +
           ICON[name] + '</svg>';
  }

  /* Local-midnight date, so day maths never drifts by timezone. */
  function d(iso){ var p = iso.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function today(){ var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function daysBetween(a,b){ return Math.round((b - a) / 86400000); }

  function currentIndex(){
    var t = today();
    for (var i = 0; i < TRIP.days.length; i++){
      if (daysBetween(d(TRIP.days[i].iso), t) === 0) return i;
    }
    return null;
  }

  function greeting(){
    var h = new Date().getHours();
    return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  }

  /* Group icon for a ticket, so the list reads at a glance. */
  function ticketIcon(t){
    return t.group === "Flights" ? "plane"
         : t.group === "Rail" ? "train"
         : t.group === "Ground" ? "car"
         : t.group === "Dining" ? "fork" : "star";
  }

  /* ---------- shared blocks ---------- */
  /* ---------- colour + photography ---------- */

  /* Which of the five bases a day belongs to. Travel days key to where they
     start, which is why "Rome → Venice" reads as Rome. */
  function cityKey(day){
    var c = day.city;
    if (c.indexOf("Salt Lake") === 0) return "Home";
    if (c.indexOf("Rome") === 0) return "Rome";
    if (c.indexOf("Venice") === 0) return "Venice";
    if (c.indexOf("Lake Como") === 0) return "Lake Como";
    if (c.indexOf("Interlaken") === 0) return "Interlaken";
    if (c.indexOf("Paris") === 0) return "Paris";
    return "Home";
  }
  /* Tolerate a data.js that predates the palette. A service worker can serve a
     mixed set of files across a version bump, and a missing map must degrade to
     the mono design rather than throw and leave a blank screen. */
  function cityColor(name){
    var c = TRIP.cities && TRIP.cities[name];
    return c ? c.color : "#212529";
  }
  /* Inline custom properties: --accent tints the scrim and the accents,
     --bg-img points at the photograph. */
  function skin(cityName, imgKey){
    var s = '--accent:' + cityColor(cityName) + ';';
    if (imgKey) s += "--bg-img:url('img/" + imgKey + ".jpg');";
    return s;
  }
  function skinSq(cityName, imgKey){
    var s = '--accent:' + cityColor(cityName) + ';';
    if (imgKey) s += "--bg-img:url('img/" + imgKey + "-sq.jpg');";
    return s;
  }
  function dot(cityName){
    return '<span class="dot" style="--accent:' + cityColor(cityName) + '"></span>';
  }

  function pageHead(title, sub){
    return '<div style="margin-bottom:4px"><h1 class="greet">' + esc(title) + '</h1>' +
           (sub ? '<p class="greet-sub">' + esc(sub) + '</p>' : '') + '</div>';
  }

  function detailHead(back, title, sub){
    return '<div class="dhead">' +
      '<button class="circ" data-go="' + back + '" aria-label="Back">' + svg("chevL") + '</button>' +
      '<div class="mid"><b>' + esc(title) + '</b>' +
      (sub ? '<span>' + esc(sub) + '</span>' : '') + '</div>' +
      '<div class="spacer"></div></div>';
  }

  function sect(title, linkLabel, linkGo){
    return '<div class="sect"><h2>' + esc(title) + '</h2>' +
      (linkLabel ? '<button class="link" data-go="' + linkGo + '">' +
        esc(linkLabel) + '</button>' : '') + '</div>';
  }

  function note(text, kind, label){
    return '<div class="note' + (kind ? ' ' + kind : '') + '">' +
      (label ? '<span class="label">' + esc(label) + '</span>' : '') +
      esc(text) + '</div>';
  }

  function timelineBlock(day){
    if (!day.timeline || !day.timeline.length) return "";
    var h = '<ul class="tl">';
    day.timeline.forEach(function(s){
      h += '<li><div class="t">' + esc(s.t) + '</div><b>' + esc(s.what) + '</b>' +
           (s.detail ? '<span>' + esc(s.detail) + '</span>' : '') + '</li>';
    });
    return h + '</ul>';
  }

  function relatedTickets(day){
    var key = day.date.replace(/^\w+ /, "");
    return TRIP.tickets.filter(function(t){ return t.title.indexOf(key) !== -1; });
  }

  function ticketItem(t){
    return '<button class="item" data-go="#/ticket/' + t.id + '">' +
      '<div class="thumb dark">' + svg(ticketIcon(t)) + '</div>' +
      '<div class="txt"><b>' + esc(t.title) + '</b><em>' + esc(t.provider) +
      ' &middot; ' + esc(t.ref) + '</em></div>' +
      '<div class="go">' + svg("chevR") + '</div></button>';
  }

  /* The Day-N accordion card, matching the tour-schedule pattern. */
  function dayAcc(day, open){
    var city = cityKey(day);
    return '<details class="acc"' + (open ? ' open' : '') +
      ' style="' + skin(city, null) + '">' +
      '<summary><div class="thumb pic" style="' + skinSq(city, day.img) + '">' +
      day.n + '</div>' +
      '<div class="txt"><span class="label">' + esc(day.date) + '</span>' +
      '<b>' + esc(day.title) + '</b><em>' + esc(day.city) + '</em></div>' +
      '<div class="chev">' + svg("chevD") + '</div></summary>' +
      '<div class="inner">' +
      (day.summary ? '<p class="lead">' + esc(day.summary) + '</p>' : '') +
      (day.critical ? note(day.critical, "alert", "Read this") : "") +
      timelineBlock(day) +
      '<a class="btn-wide" data-go="#/day/' + day.n + '">Open day ' + day.n + '</a>' +
      '</div></details>';
  }

  /* ---------- views ---------- */
  var views = {};

  views.today = function(){
    var idx = currentIndex();
    var h = "";

    if (idx === null){
      var out = daysBetween(today(), d(TRIP.meta.start));
      if (out > 0){
        h += pageHead(greeting() + ", Brandon", TRIP.meta.travellers);
        h += '<div class="hero photo" style="margin-top:18px;' +
             skin("Rome", "rome-colosseum") + '">' +
             '<span class="label">Days until you fly</span>' +
             '<div class="count">' + out + '</div>' +
             '<p>Departing ' + esc(TRIP.days[0].date) + ' &middot; Rome first</p>' +
             '<button class="cta" data-go="#/day/1"><span>See day one</span><i>' +
             svg("arrowR") + '</i></button></div>';
        h += sect("The route", "All days", "#/days");
        h += routeStrip();
        h += sect("Still to sort", "See all", "#/open");
        TRIP.open.slice(0, 3).forEach(function(o){
          h += '<button class="item" data-go="#/open"><div class="thumb">' +
               svg("checks") + '</div><div class="txt"><b>' + esc(o.what) +
               '</b><em>' + esc(o.when) + '</em></div><div class="go">' +
               svg("chevR") + '</div></button>';
        });
        return h;
      }
      h += pageHead("Welcome home", "23 days, five cities");
      h += sect("The whole trip", null, null);
      TRIP.days.forEach(function(day){ h += dayAcc(day, false); });
      return h;
    }

    var day = TRIP.days[idx];
    h += pageHead(greeting() + ", Brandon", "Day " + day.n + " of 23 · " + day.city);
    h += '<div class="hero photo" style="margin-top:18px;' +
         skin(cityKey(day), day.img) + '">' +
         '<span class="label">Today &middot; ' + esc(day.date) + '</span>' +
         '<h1>' + esc(day.title) + '</h1>' +
         '<p>' + esc(day.city) + '</p>' +
         '<button class="cta" data-go="#/day/' + day.n + '">' +
         '<span>Open the full day</span><i>' + svg("arrowR") + '</i></button></div>';

    if (day.critical) h += note(day.critical, "alert", "Read this");

    if (day.timeline && day.timeline.length){
      h += sect("Today's schedule", null, null);
      h += '<div class="card">' + timelineBlock(day) + '</div>';
    } else if (day.summary){
      h += '<div class="card"><p class="lead">' + esc(day.summary) + '</p></div>';
    }

    var rel = relatedTickets(day);
    if (rel.length){
      h += sect("Tickets for today", "All", "#/tickets");
      rel.forEach(function(t){ h += ticketItem(t); });
    }

    if (day.checklist && day.checklist.length){
      h += sect("Before you go", null, null);
      h += '<div class="card"><ul class="check">';
      day.checklist.forEach(function(c){ h += '<li>' + esc(c) + '</li>'; });
      h += '</ul></div>';
    }

    if (idx + 1 < TRIP.days.length){
      var nx = TRIP.days[idx + 1];
      h += sect("Tomorrow", null, null);
      h += '<button class="item" data-go="#/day/' + nx.n + '">' +
           '<div class="thumb' + (nx.kind === "open" ? "" : " dark") + '"' +
           ' style="font-size:19px;font-weight:700;color:' +
           (nx.kind === "open" ? "var(--ink)" : "#fff") + '">' + nx.n + '</div>' +
           '<div class="txt"><b>' + esc(nx.title) + '</b><em>' + esc(nx.date) +
           ' &middot; ' + esc(nx.city) + '</em></div>' +
           '<div class="go">' + svg("chevR") + '</div></button>';
    }
    return h;
  };

  /* Five bases as a compact strip on the pre-trip home. */
  function routeStrip(){
    var h = '<div class="card">';
    TRIP.stays.forEach(function(s){
      h += '<div class="kv" style="' + skin(s.city, null) + '">' +
           '<div class="k">' + esc(s.inDate) + ' &rarr; ' + esc(s.outDate) + '</div>' +
           '<div class="v">' + dot(s.city) + '<b>' + esc(s.city) + '</b> &middot; ' +
           s.nights + ' nights</div></div>';
    });
    return h + '</div>';
  }

  views.days = function(filter){
    var cities = ["All", "Rome", "Venice", "Lake Como", "Interlaken", "Paris"];
    var active = filter ? decodeURIComponent(filter) : "All";
    var idx = currentIndex();

    var h = pageHead("The trip", "23 days · five cities");
    h += '<div class="chips" style="margin-top:16px">';
    cities.forEach(function(c){
      h += '<button class="chip" aria-pressed="' + (c === active) +
           '" data-go="#/days/' + encodeURIComponent(c) + '">' +
           (c === "All" ? "" : dot(c)) + esc(c) + '</button>';
    });
    h += '</div>';

    var shown = TRIP.days.filter(function(day){
      return active === "All" || cityKey(day) === active;
    });
    if (!shown.length) return h + '<div class="card"><p class="lead">Nothing here.</p></div>';

    shown.forEach(function(day, i){
      h += dayAcc(day, shown.length <= 6 && i === 0 ? false : false);
      if (idx !== null && TRIP.days[idx] === day){
        /* mark today's card visually via the thumb already; nothing extra needed */
      }
    });
    return h;
  };

  views.day = function(n){
    var day = null, i = -1;
    TRIP.days.forEach(function(x, k){ if (x.n === +n){ day = x; i = k; } });
    if (!day) return pageHead("Not found", "");

    /* Header carries the where/when; the hero below carries the what, so the
       two don't say the same thing twice. */
    var h = detailHead("#/days", day.city, day.date);

    /* Everything below inherits this city's accent — timeline times, field
       labels and rules all pick it up from --accent. */
    h += '<div style="' + skin(cityKey(day), null) + '">';

    h += '<div class="hero photo" style="' + skin(cityKey(day), day.img) + '">' +
         '<span class="label">Day ' + day.n + ' of 23</span>' +
         '<h1>' + esc(day.title) + '</h1>' +
         '<p>' + esc(day.date) + ' &middot; ' + esc(day.city) + '</p>' +
         (day.high != null ? '<p style="margin-top:10px">High ' + day.high +
           '&deg; &middot; Low ' + day.low + '&deg; &middot; Rain ' +
           Math.round(day.rain * 100) + '%</p>' : '') + '</div>';

    if (day.summary) h += '<div class="card"><p class="lead">' + esc(day.summary) + '</p></div>';
    if (day.critical) h += note(day.critical, "alert", "Read this");

    if (day.timeline && day.timeline.length){
      h += sect("The moves", null, null);
      h += '<div class="card">' + timelineBlock(day) + '</div>';
    }

    if (day.notes && day.notes.length){
      h += sect("Notes", null, null);
      h += '<div class="card">';
      day.notes.forEach(function(nn, k){
        h += '<div class="kv"><div class="v">' + esc(nn) + '</div></div>';
      });
      h += '</div>';
    }

    if (day.excursionDay){
      h += sect("Pick one", "All options", "#/open");
      TRIP.excursions.forEach(function(x){
        h += '<details class="acc"><summary>' +
             '<div class="thumb soft">' + svg("pin") + '</div>' +
             '<div class="txt"><b>' + esc(x.name) + '</b><em>Weather decides</em></div>' +
             '<div class="chev">' + svg("chevD") + '</div></summary>' +
             '<div class="inner"><p class="lead">' + esc(x.gist) + '</p>' +
             (x.detail ? '<p class="lead">' + esc(x.detail) + '</p>' : '') +
             '</div></details>';
      });
    }

    var rel = relatedTickets(day);
    if (rel.length){
      h += sect("Tickets", "All", "#/tickets");
      rel.forEach(function(t){ h += ticketItem(t); });
    }

    if (day.checklist && day.checklist.length){
      h += sect("Before you go", null, null);
      h += '<div class="card"><ul class="check">';
      day.checklist.forEach(function(c){ h += '<li>' + esc(c) + '</li>'; });
      h += '</ul></div>';
    }

    h += '<div class="btns" style="margin-top:20px">';
    if (i > 0) h += '<button class="btn ghost" data-go="#/day/' + TRIP.days[i-1].n +
                    '">' + svg("chevL") + 'Day ' + TRIP.days[i-1].n + '</button>';
    if (i < TRIP.days.length - 1) h += '<button class="btn" data-go="#/day/' +
                    TRIP.days[i+1].n + '">Day ' + TRIP.days[i+1].n + svg("chevR") + '</button>';
    h += '</div>';
    h += '</div>';   /* close the city-accent wrapper */
    return h;
  };

  views.tickets = function(){
    var groups = [], seen = {};
    TRIP.tickets.forEach(function(t){
      if (!seen[t.group]){ seen[t.group] = []; groups.push(t.group); }
      seen[t.group].push(t);
    });

    var h = pageHead("Tickets", "Every reference in one place");
    groups.forEach(function(g){
      h += sect(g, null, null);
      seen[g].forEach(function(t){ h += ticketItem(t); });
    });

    h += sect("Accounts these live under", null, null);
    h += '<div class="card">';
    TRIP.accounts.forEach(function(a){
      h += '<div class="kv"><div class="k">' + esc(a.label) + '</div>' +
           '<div class="v">' + esc(a.value) + '</div></div>';

  views.ticket = function(id){
    var t = null;
    TRIP.tickets.forEach(function(x){ if (x.id === id) t = x; });
    if (!t) return pageHead("Not found", "");

    /* Provider up top, the booking itself in the hero — no repeated title. */
    var h = detailHead("#/tickets", t.provider, t.group);

    h += '<div class="hero"><span class="label">' + esc(t.group) + '</span>' +
         '<h1>' + esc(t.title) + '</h1>' +
         '<p class="mono" style="font-size:15px;color:#fff;margin-top:8px">' +
         esc(t.ref) + '</p></div>';

    if (t.warn) h += note(t.warn, "alert", "Read this");

    if (t.lines && t.lines.length){
      h += '<div class="card">';
      t.lines.forEach(function(l){
        h += '<div class="kv"><div class="k">' + esc(l[0]) + '</div>' +
             '<div class="v">' + esc(l[1]) + '</div></div>';
      });
      h += '</div>';
    }

    if (t.people && t.people.length){
      h += sect("Who sits where", null, null);
      h += '<div class="card">';
      t.people.forEach(function(p){
        h += '<div class="kv"><div class="k">' + esc(p.who) + '</div>' +

  /* ---------- nav ---------- */
  var TABS = [
    { id:"today",   icon:"home",   label:"Today" },
    { id:"days",    icon:"cal",    label:"Days" },
    { id:"tickets", icon:"ticket", label:"Tickets" },
    { id:"stays",   icon:"bed",    label:"Stays" },
    { id:"open",    icon:"checks", label:"Open" },
  ];

  function renderTabs(active){
    var h = "";
    TABS.forEach(function(t){
      h += '<button data-go="#/' + t.id + '" aria-current="' + (t.id === active) +
           '" aria-label="' + t.label + '">' + svg(t.icon) + '</button>';
    });
    el("tabs").innerHTML = h;
  }

  /* ---------- router ---------- */
  function route(){
    var hash = location.hash || "#/today";
    var parts = hash.replace(/^#\//, "").split("/");
    var view = parts[0] || "today";
    var arg = parts[1];

    var html, tab = view;
    if (view === "day"){ html = views.day(arg); tab = "days"; }
    else if (view === "days"){ html = views.days(arg); }
    else if (view === "ticket"){ html = views.ticket(arg); tab = "tickets"; }
    else if (views[view]){ html = views[view](); }
    else { html = views.today(); tab = "today"; }

    el("app").innerHTML = html;
    renderTabs(tab);
    window.scrollTo(0, 0);
  }

  /* One delegated handler for every internal navigation. Anchors that carry
     data-go are internal too, so stop them following their href. */
  document.addEventListener("click", function(e){
    var target = e.target.closest("[data-go]");
    if (!target) return;
    e.preventDefault();
    location.hash = target.getAttribute("data-go");
  });

  window.addEventListener("hashchange", route);
  route();

  var sos = document.createElement("button");
  sos.className = "sos";
  sos.textContent = "SOS";
  sos.setAttribute("data-go", "#/sos");
  sos.setAttribute("aria-label", "Emergency numbers");
  document.body.appendChild(sos);

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){ /* offline is best-effort */ });
    });
  }
})();
</script>
</body>
</html>
