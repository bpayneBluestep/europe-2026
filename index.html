<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Europe 2026</title>
<meta name="description" content="Offline trip companion — Rome, Venice, Lake Como, Interlaken, Paris.">
<link rel="manifest" href="manifest.webmanifest">
<!-- Self-hosted, not a CDN: the map has to come up with no network. -->
<link rel="stylesheet" href="vendor/leaflet.css">
<meta name="theme-color" content="#f5f6f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Europe 26">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  /* Instrument Sans, self-hosted so the app still renders offline. */
  @font-face{
    font-family:'Instrument Sans'; font-style:normal; font-weight:400 700;
    font-display:swap; src:url(fonts/instrument-sans-latin.woff2) format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
      U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,
      U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:'Instrument Sans'; font-style:normal; font-weight:400 700;
    font-display:swap; src:url(fonts/instrument-sans-latin-ext.woff2) format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,
      U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,
      U+2113,U+2C60-2C7F,U+A720-A7FF;
  }

  :root{
    --ink:#212529;
    --bg:#f5f6f7;
    --card:#ffffff;
    --dim:#6c727a;
    --faint:#9aa0a6;
    --line:#ecedef;
    --sunk:#eceef0;
    --alert:#b42318;
    --alert-bg:#fef3f2;
    --r-lg:24px;
    --r-md:18px;
    --r-sm:13px;
    --shadow:0 1px 2px rgba(33,37,41,.04), 0 8px 24px rgba(33,37,41,.05);
    --nav-h:calc(72px + env(safe-area-inset-bottom));
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px; line-height:1.5; letter-spacing:-.005em;
    padding-bottom:var(--nav-h);
    -webkit-text-size-adjust:100%; overscroll-behavior-y:none;
  }
  a{color:inherit}
  ::-webkit-scrollbar{display:none}

  main{
    max-width:560px; margin:0 auto;
    padding:calc(18px + env(safe-area-inset-top)) 20px 28px;
  }

  /* ---------- type ---------- */
  .greet{font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.15;margin:0}
  .greet-sub{font-size:14px;color:var(--dim);margin:5px 0 0}
  .sect{display:flex;align-items:baseline;justify-content:space-between;
    margin:26px 0 12px;gap:12px}
  .sect h2{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0}
  .sect a,.sect button.link{font-size:13.5px;color:var(--ink);text-decoration:underline;
    text-underline-offset:3px;background:none;border:0;font:inherit;padding:0;cursor:pointer}
  .lead{font-size:15px;color:var(--dim);margin:0 0 10px}
  .lead:last-child{margin-bottom:0}
  .label{font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--faint);
    text-transform:uppercase}
  .mono{font-variant-numeric:tabular-nums;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.02em}

  /* ---------- cards ---------- */
  .card{background:var(--card);border-radius:var(--r-lg);padding:18px;
    margin-bottom:12px;box-shadow:var(--shadow)}
  .card.pad-sm{padding:15px 17px}
  .card:last-child{margin-bottom:0}

  /* Hero. Solid ink by default; add .photo + a --bg-img and the photograph
     carries the colour, with a scrim so white type stays legible over it. */
  .hero{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:22px;
    margin-bottom:14px;position:relative;overflow:hidden;isolation:isolate}
  .hero.photo{background:var(--accent,var(--ink));min-height:238px;
    display:flex;flex-direction:column;justify-content:flex-end;padding:20px}
  .hero.photo::before{content:"";position:absolute;inset:0;z-index:-2;
    background-image:var(--bg-img);background-size:cover;background-position:center}
  /* Scrim: almost nothing over the top two-thirds so the photograph keeps its
     colour, deepening to the city's accent only where the type sits. */
  .hero.photo::after{content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(178deg,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,.10) 38%,
      color-mix(in srgb, var(--accent,#212529) 40%, rgba(0,0,0,.55)) 76%,
      color-mix(in srgb, var(--accent,#212529) 52%, rgba(0,0,0,.80)) 100%)}
  .hero .label{color:rgba(255,255,255,.72)}
  .hero.photo h1,.hero.photo p{text-shadow:0 1px 12px rgba(0,0,0,.35)}
  .hero h1{font-size:27px;font-weight:700;letter-spacing:-.028em;line-height:1.16;
    margin:9px 0 6px}
  .hero p{font-size:14px;color:rgba(255,255,255,.7);margin:0}
  .hero .cta{display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-top:20px;background:rgba(255,255,255,.1);border-radius:999px;
    padding:7px 8px 7px 20px;border:0;width:100%;font:inherit;color:#fff;cursor:pointer;
    text-align:left}
  .hero .cta span{font-size:14.5px;font-weight:600}
  .hero .cta i{flex:0 0 36px;height:36px;border-radius:999px;background:#fff;
    display:grid;place-items:center;font-style:normal}
  .hero .cta i svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .hero .count{font-size:52px;font-weight:700;letter-spacing:-.04em;line-height:1;
    margin:10px 0 4px;font-variant-numeric:tabular-nums}

  /* ---------- circular buttons ---------- */
  .circ{width:42px;height:42px;border-radius:999px;background:var(--card);border:0;
    display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);
    flex:0 0 42px;padding:0;color:var(--ink)}
  .circ svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}

  /* ---------- detail header ---------- */
  .dhead{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .dhead .mid{flex:1;min-width:0;text-align:center}
  .dhead .mid b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dhead .mid span{display:block;font-size:12.5px;color:var(--dim);margin-top:1px}
  .dhead .spacer{flex:0 0 42px}

  /* ---------- chips ---------- */
  .chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 16px;padding:2px 20px 4px;
    scrollbar-width:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);
    color:var(--ink);border-radius:999px;padding:9px 17px;font:inherit;font-size:13.5px;
    font-weight:500;cursor:pointer;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);
    font-weight:600}

  /* ---------- accordion / list rows ---------- */
  .acc{background:var(--card);border-radius:var(--r-lg);margin-bottom:10px;
    box-shadow:var(--shadow);overflow:hidden}
  .acc>summary{display:flex;align-items:center;gap:14px;padding:14px;cursor:pointer;
    list-style:none}
  .acc>summary::-webkit-details-marker{display:none}
  .acc .thumb{flex:0 0 54px;height:54px;border-radius:var(--r-sm);background:var(--ink);
    color:#fff;display:grid;place-items:center;font-size:19px;font-weight:700;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums;position:relative;
    overflow:hidden;isolation:isolate}
  .acc .thumb.soft{background:var(--sunk);color:var(--accent,var(--ink))}
  /* Without this an icon inside an accordion thumb renders as a filled blob. */
  .acc .thumb svg{width:21px;height:21px;stroke:currentColor;fill:none;
    stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
  /* Photo thumbnail: the day number sits on the picture, tinted by the city. */
  .acc .thumb.pic{background-image:var(--bg-img);background-size:cover;
    background-position:center;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  /* Darken behind the numeral only, so the picture stays vivid at the edges. */
  .acc .thumb.pic::before{content:"";position:absolute;inset:0;z-index:-1;
    background:
      radial-gradient(circle at 50% 52%, rgba(0,0,0,.62) 0%, rgba(0,0,0,.10) 74%),
      color-mix(in srgb, var(--accent,#212529) 14%, transparent)}
  .acc .txt{flex:1;min-width:0}
  .acc .txt .label{display:block;margin-bottom:2px}
  .acc .txt b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.015em;
    line-height:1.3}
  .acc .txt em{display:block;font-style:normal;font-size:12.5px;color:var(--faint);
    margin-top:2px}
  .acc .chev{flex:0 0 20px;color:var(--faint);transition:transform .18s ease}
  .acc .chev svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round;display:block}
  .acc[open] .chev{transform:rotate(180deg)}
  .acc .inner{padding:0 18px 18px}

  /* tappable list card (no accordion) */
  .item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:var(--card);border:0;border-radius:var(--r-lg);padding:14px;
    margin-bottom:10px;box-shadow:var(--shadow);font:inherit;color:inherit;cursor:pointer}
  .item .thumb{flex:0 0 54px;height:54px;border-radius:var(--r-sm);background:var(--sunk);
    display:grid;place-items:center}
  .item .thumb svg{width:21px;height:21px;stroke:var(--ink);fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .item .thumb.dark{background:var(--ink)}
  .item .thumb.dark svg{stroke:#fff}
  .item .txt{flex:1;min-width:0}
  .item .txt b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.015em;
    line-height:1.3}
  .item .txt em{display:block;font-style:normal;font-size:12.5px;color:var(--faint);
    margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .go{flex:0 0 20px;color:var(--faint)}
  .item .go svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round;display:block}

  /* ---------- timeline (Morning / Afternoon / Evening pattern) ---------- */
  .tl{list-style:none;margin:0;padding:0}
  .tl li{padding:13px 0;border-top:1px solid var(--line)}
  .tl li:first-child{border-top:0;padding-top:2px}
  .tl .t{font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--faint);
    text-transform:uppercase;font-variant-numeric:tabular-nums}
  .tl b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.015em;
    margin-top:4px;line-height:1.32}
  .tl span{display:block;font-size:14px;color:var(--dim);margin-top:5px;line-height:1.45}

  /* ---------- key/value rows ---------- */
  .kv{padding:12px 0;border-top:1px solid var(--line)}
  .kv:first-child{border-top:0;padding-top:0}
  .kv .k{font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--faint);
    text-transform:uppercase}
  .kv .v{font-size:15px;margin-top:4px;line-height:1.4;word-break:break-word}
  .kv .v a{text-decoration:underline;text-underline-offset:3px}

  /* ---------- notes ---------- */
  .note{border-radius:var(--r-md);padding:15px 17px;font-size:14.5px;line-height:1.5;
    margin-bottom:12px;background:var(--sunk);color:var(--ink)}
  .note.alert{background:var(--alert-bg);color:var(--alert);font-weight:500}
  .note .label{display:block;margin-bottom:6px}
  .note.alert .label{color:var(--alert);opacity:.7}

  /* ---------- city colour accents ---------- */
  .dot{display:inline-block;width:9px;height:9px;border-radius:999px;
    background:var(--accent,var(--ink));margin-right:8px;vertical-align:middle;
    position:relative;top:-1px}
  .chip .dot{width:7px;height:7px;margin-right:7px}
  .chip[aria-pressed="true"] .dot{background:#fff}
  .sect h2 .dot{width:10px;height:10px}
  /* A tinted rule under a city's section, so the colour reads without shouting. */
  .accent-rule{height:3px;border-radius:2px;background:var(--accent,var(--ink));
    width:34px;margin:-4px 0 14px}
  .tl .t{color:var(--accent,var(--faint))}
  .kv .k{color:var(--accent,var(--faint));opacity:.85}

  /* photo banner used on stay cards */
  .banner{height:150px;border-radius:var(--r-md);background-image:var(--bg-img);
    background-size:cover;background-position:center;margin:-4px 0 14px;
    position:relative;overflow:hidden}
  .banner::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 45%,
      color-mix(in srgb, var(--accent,#212529) 55%, rgba(0,0,0,.6)) 100%)}

  /* ---------- wishlist ---------- */
  .wl-form{background:var(--card);border-radius:var(--r-lg);padding:16px;
    margin-bottom:14px;box-shadow:var(--shadow)}
  .wl-form input,.wl-form select,.wl-form textarea{width:100%;font:inherit;
    font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;margin-bottom:9px;-webkit-appearance:none}
  .wl-form textarea{min-height:64px;resize:vertical}
  .wl-form input:focus,.wl-form select:focus,.wl-form textarea:focus{
    outline:2px solid var(--accent,var(--ink));outline-offset:-1px;
    background:var(--card)}
  .wl-form label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.04em;
    color:var(--faint);text-transform:uppercase;margin:0 0 5px 2px}

  /* A saved item. The two controls float top-right so the link button below
     can run the full width of the card — it is the thing you actually reach
     for, usually one-handed on a moving train. */
  .wl{position:relative;background:var(--card);border-radius:var(--r-lg);
    padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}
  .wl .body{min-width:0}
  .wl .body b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.015em;
    line-height:1.32;padding-right:74px}
  .wl .body .meta{font-size:12.5px;color:var(--faint);margin-top:4px;
    padding-right:74px}
  .wl .body .note{background:none;padding:0;margin:6px 0 0;font-size:14px;
    color:var(--dim)}

  /* Full-width, thumb-sized call to action rather than a small underlined
     link — a 15px link is a miss target on a phone. */
  /* The two links sit on one row when both exist: the content link takes the
     space, the map link is a fixed, narrower companion. */
  .links{display:flex;gap:8px;margin-top:12px}
  .links > *{margin-top:0}
  .links .src{flex:1;min-width:0}
  .links .map{flex:0 0 108px}
  .wl .body a.src,.wm a.src{display:flex;align-items:center;justify-content:center;gap:8px;
    margin-top:12px;min-height:48px;padding:0 18px;border-radius:13px;
    background:var(--accent,var(--ink));color:#fff;font-size:15px;font-weight:600;
    letter-spacing:-.01em;text-decoration:none}
  .wl .body a.src:active,.wm a.src:active{filter:brightness(.9)}
  .wl .body a.src svg,.wm a.src svg{width:17px;height:17px;stroke:#fff;fill:none;
    stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 17px}

  /* Locked in: a booked thing, not a suggestion. Reads as settled — the accent
     runs down the edge and the card sits on the accent's own tint. */
  .wl.lok{border-left:3px solid var(--accent,var(--ink));
    background:color-mix(in srgb, var(--accent,var(--ink)) 5%, var(--card))}
  .locktag{display:inline-flex;align-items:center;gap:4px;font-size:11px;
    font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--accent,var(--ink));margin-bottom:5px}
  .locktag svg{width:12px;height:12px;stroke:currentColor;fill:none;
    stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  /* The lock toggle in the edit form. */
  .lockrow{display:flex;align-items:center;gap:10px;margin:2px 0 12px;
    padding:11px 13px;border-radius:12px;background:var(--bg);
    border:1px solid var(--line)}
  .lockrow input{width:20px;height:20px;flex:0 0 20px;accent-color:var(--ink);
    margin:0}
  .lockrow span{font-size:14px;color:var(--ink)}
  .lockrow em{display:block;font-style:normal;font-size:12px;color:var(--faint);
    margin-top:2px}

  /* Compact suggestion inside a day accordion. */
  .wm{margin-top:10px}
  .wm b{display:block;font-size:15px;font-weight:600;letter-spacing:-.015em}
  .wm .meta{font-size:12.5px;color:var(--faint);margin-top:3px}
  .wm .note{background:none;padding:0;margin:6px 0 0;font-size:14px;color:var(--dim)}

  /* Small label separating the parts of an accordion. */
  .mini-h{font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--faint);
    text-transform:uppercase;margin:18px 0 2px}

  /* The map link is the quieter of the two — outlined, not filled, so the
     thing you actually want to watch stays the loud one. */
  .wl .body a.map,.wm a.map{display:flex;align-items:center;justify-content:center;
    gap:6px;margin-top:12px;min-height:48px;padding:0 12px;border-radius:13px;
    background:transparent;color:var(--accent,var(--ink));font-size:15px;
    font-weight:600;letter-spacing:-.01em;text-decoration:none;
    border:1.6px solid color-mix(in srgb, var(--accent,var(--ink)) 40%, transparent)}
  .wl .body a.map:active,.wm a.map:active{
    background:color-mix(in srgb, var(--accent,var(--ink)) 10%, transparent)}
  .wl .body a.map svg,.wm a.map svg{width:16px;height:16px;stroke:currentColor;
    fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 16px}

  .wl .acts{position:absolute;top:11px;right:11px;display:flex;gap:2px}
  .wl .acts button{width:32px;height:32px;border-radius:999px;border:0;
    background:none;color:var(--faint);cursor:pointer;display:grid;
    place-items:center;padding:0}
  .wl .acts button svg{width:17px;height:17px;stroke:currentColor;fill:none;
    stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  /* The row of buttons under the edit form. */
  .wl-form .row{display:flex;gap:9px;margin-top:4px}
  .wl-form .row button{flex:1;min-height:46px;border-radius:13px;border:0;
    font:inherit;font-size:15px;font-weight:600;cursor:pointer;
    background:var(--ink);color:#fff}
  .wl-form .row button.ghost{background:var(--bg);color:var(--dim);
    border:1px solid var(--line)}
  /* Any icon inside a wide button needs a size, or the raw SVG expands to fill
     the button and swallows the label. */
  #wlOpen,#mapLocate{display:flex;align-items:center;justify-content:center;gap:8px}
  #wlOpen svg,#mapLocate svg{width:17px;height:17px;stroke:currentColor;fill:none;
    stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 17px}

  /* ---------- map ---------- */
  /* The map fills the screen under the header. Leaflet needs a pixel height on
     its container or it renders 0px tall and looks broken. */
  #mapwrap{position:relative;border-radius:var(--r-lg);overflow:hidden;
    box-shadow:var(--shadow);background:var(--card);margin-top:14px}
  #map{height:62vh;min-height:340px;width:100%;background:#e8e6e1}
  .leaflet-container{font:inherit;background:#e8e6e1}

  /* Markers are CSS, not images — no PNG to 404 when offline, and the city
     accent can drive the colour. */
  .mk{width:26px;height:26px;border-radius:999px;border:2.5px solid #fff;
    box-shadow:0 2px 6px rgba(33,37,41,.4);display:grid;place-items:center;
    background:var(--mk,#212529)}
  .mk.big{width:32px;height:32px}
  .mk svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.4;
    stroke-linecap:round;stroke-linejoin:round}
  .mk.lok::after{content:"";position:absolute;inset:-5px;border-radius:999px;
    border:2px solid var(--mk,#212529)}
  .mk-wrap{position:relative;display:grid;place-items:center}
  /* Transit is scaffolding, not a destination — slate grey and square-ish so
     it never reads as somewhere you chose to go. */
  .mk.tr{background:#5a6572;border-radius:9px;width:24px;height:24px}
  .mk.tr svg{width:13px;height:13px}

  /* Your own position: a pulsing dot, deliberately unlike a place marker. */
  .mk.me{background:#1a73e8;width:18px;height:18px}

  .leaflet-popup-content-wrapper{border-radius:14px;box-shadow:var(--shadow)}
  .leaflet-popup-content{margin:12px 14px;font-size:14px;line-height:1.4}
  .leaflet-popup-content b{display:block;font-size:15px;font-weight:600;
    letter-spacing:-.015em;margin-bottom:2px}
  .leaflet-popup-content .pm{color:var(--faint);font-size:12.5px}
  .leaflet-popup-content a{display:block;margin-top:8px;font-weight:600;
    color:var(--ink);font-size:13.5px}
  .leaflet-popup-content a+a{margin-top:4px}

  .mapbar{display:flex;gap:8px;align-items:center;margin-top:12px}
  .mapbar .btn-wide{margin:0}
  /* The transit toggle carries an icon, so it needs a size like any other. */
  .chip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;margin-right:2px;
    vertical-align:-2px}

  .maplist{margin-top:16px}
  .maprow{display:flex;align-items:center;gap:12px;background:var(--card);
    border-radius:var(--r-lg);padding:13px 15px;margin-bottom:8px;
    box-shadow:var(--shadow);width:100%;border:0;text-align:left;cursor:pointer;
    font:inherit;color:var(--ink)}
  .maprow .pip{flex:0 0 12px;height:12px;border-radius:999px;
    background:var(--accent,var(--ink))}
  .maprow .txt{flex:1;min-width:0}
  .maprow .txt b{display:block;font-size:14.5px;font-weight:600;
    letter-spacing:-.015em;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .maprow .txt em{font-style:normal;font-size:12.5px;color:var(--faint)}
  .maprow .dist{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--dim);
    font-variant-numeric:tabular-nums}

  /* ---------- who ---------- */
  /* Initial in a circle. Filled vs outlined rather than two colours, because
     the five city accents already use most of the usable hue space. */
  .avi{display:inline-grid;place-items:center;width:22px;height:22px;
    border-radius:999px;font-size:11px;font-weight:700;letter-spacing:0;
    background:var(--ink);color:#fff;flex:0 0 22px;line-height:1}
  .avi.alt{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.6px var(--ink)}
  .avi.none{background:var(--sunk);color:var(--faint);box-shadow:none;font-weight:600}
  .byline{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
  .byline .avi{width:18px;height:18px;font-size:9.5px;flex:0 0 18px}

  .who-pick{display:flex;gap:10px;margin-top:14px}
  .who-pick button{flex:1;display:flex;flex-direction:column;align-items:center;
    gap:9px;padding:18px 12px;border-radius:var(--r-lg);border:1px solid var(--line);
    background:var(--card);font:inherit;cursor:pointer;color:var(--ink);
    box-shadow:var(--shadow)}
  .who-pick button b{font-size:15.5px;font-weight:600}
  .who-pick .avi{width:44px;height:44px;font-size:19px;flex:0 0 44px}

  .whoami{display:inline-flex;align-items:center;gap:7px;background:none;border:0;
    font:inherit;font-size:14px;color:var(--dim);padding:0;cursor:pointer;
    margin-top:5px}
  .whoami u{text-decoration:underline;text-underline-offset:3px}

  .sync{font-size:12.5px;color:var(--faint);text-align:center;padding:14px 0 0}
  .sync b{color:var(--ink);font-weight:600}
  .empty{text-align:center;padding:34px 20px;color:var(--faint);font-size:14.5px}

  /* ---------- credits ---------- */
  .credit{font-size:12px;color:var(--faint);line-height:1.5;padding:9px 0;
    border-top:1px solid var(--line)}
  .credit:first-child{border-top:0;padding-top:0}
  .credit a{text-decoration:underline;text-underline-offset:2px}

  /* ---------- checklist ---------- */
  .check{list-style:none;margin:0;padding:0}
  .check li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;
    border-top:1px solid var(--line);font-size:14.5px}
  .check li:first-child{border-top:0;padding-top:0}
  .check li::before{content:"";flex:0 0 19px;height:19px;margin-top:1px;
    border:1.6px solid #d5d8dc;border-radius:6px}

  /* ---------- buttons ---------- */
  .btns{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:12px 20px;
    border-radius:999px;font-size:14px;font-weight:600;text-decoration:none;
    background:var(--ink);color:#fff;border:0;cursor:pointer;font-family:inherit}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn-wide{display:block;width:100%;text-align:center;padding:17px;border-radius:999px;
    background:var(--ink);color:#fff;font-size:15.5px;font-weight:600;
    text-decoration:none;margin-top:18px}

  /* ---------- QR images ---------- */
  .qr img{width:100%;max-width:290px;border-radius:var(--r-md);background:#fff;
    display:block;margin:0 auto 10px;border:1px solid var(--line)}
  .qr .missing{font-size:13.5px;color:var(--faint);background:var(--sunk);
    border-radius:var(--r-md);padding:16px;text-align:center;margin-bottom:10px}

  /* ---------- floating nav pill ---------- */
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
    padding:0 20px calc(14px + env(safe-area-inset-bottom));pointer-events:none;
  }
  nav .pill{
    pointer-events:auto;display:flex;gap:4px;background:var(--ink);border-radius:999px;
    padding:7px;box-shadow:0 6px 24px rgba(33,37,41,.22);
  }
  nav .pill{gap:3px}
  nav button{
    appearance:none;border:0;background:none;width:44px;height:44px;border-radius:999px;
    display:grid;place-items:center;cursor:pointer;color:rgba(255,255,255,.62);padding:0;
    transition:background .16s ease,color .16s ease;
  }
  nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round}
  nav button[aria-current="true"]{background:#fff;color:var(--ink)}

  /* SOS — always reachable, sits just above the nav pill */
  .sos{position:fixed;right:20px;bottom:calc(var(--nav-h) + 8px);z-index:39;
    width:50px;height:50px;border-radius:999px;border:0;background:var(--card);
    color:var(--alert);font:inherit;font-size:11.5px;font-weight:700;letter-spacing:.05em;
    box-shadow:0 4px 18px rgba(33,37,41,.16);cursor:pointer}
</style>
</head>
<body>

<main id="app"></main>
<nav><div class="pill" id="tabs"></div></nav>

<script src="vendor/leaflet.js"></script>
<script src="data.js"></script>
<script src="days.js"></script>
<script src="store.js"></script>
<script>
(function(){
  "use strict";

  /* ---------- helpers ---------- */
  var E = document.createElement("div");
  function esc(s){ E.textContent = s == null ? "" : String(s); return E.innerHTML; }
  /* esc() escapes &, < and > but not quotes, which is fine for text nodes and
     wrong for an attribute value. Anything user-typed that lands in an
     attribute goes through this instead. */
  function escA(s){ return esc(s).replace(/"/g, "&quot;"); }
  function el(id){ return document.getElementById(id); }

  var ICON = {
    home:    '<path d="M3.2 11.4 12 4l8.8 7.4"/><path d="M5.6 10.2V20h12.8v-9.8"/>',
    cal:     '<rect x="3.5" y="5.2" width="17" height="15.3" rx="3.4"/><path d="M8 3.2v3.6M16 3.2v3.6M3.5 10.2h17"/>',
    ticket:  '<path d="M3.4 8.8a2.2 2.2 0 0 1 2.2-2.2h12.8a2.2 2.2 0 0 1 2.2 2.2v.9a2.3 2.3 0 0 0 0 4.6v.9a2.2 2.2 0 0 1-2.2 2.2H5.6a2.2 2.2 0 0 1-2.2-2.2v-.9a2.3 2.3 0 0 0 0-4.6z"/><path d="M14.2 7v10" stroke-dasharray="2 2.6"/>',
    bed:     '<path d="M3.5 19v-9M3.5 14h17v5M20.5 14v-2.6a2.4 2.4 0 0 0-2.4-2.4H11V14"/><circle cx="7.2" cy="11.4" r="1.9"/>',
    checks:  '<path d="M3.5 7.6 5.4 9.5 8.9 6"/><path d="M3.5 16.1 5.4 18l3.5-3.5"/><path d="M12.5 8h8M12.5 17h8"/>',
    chevD:   '<path d="M6 9.5 12 15.5 18 9.5"/>',
    chevR:   '<path d="M9.5 5.5 16 12l-6.5 6.5"/>',
    chevL:   '<path d="M14.5 5.5 8 12l6.5 6.5"/>',
    arrowR:  '<path d="M4.5 12h15M13.5 6l6 6-6 6"/>',
    pin:     '<path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/>',
    plane:   '<path d="M10.4 3.6a1.6 1.6 0 0 1 3.2 0V9l7.4 4.3v2.3l-7.4-2.3v4l2.6 2v1.7L12 20l-4.2 1v-1.7l2.6-2v-4L3 15.6v-2.3L10.4 9z"/>',
    train:   '<rect x="5" y="3.6" width="14" height="13" rx="3.4"/><path d="M5 11h14M8.5 20.4 6.6 16.6M15.5 20.4l1.9-3.8"/><circle cx="8.8" cy="13.8" r=".9"/><circle cx="15.2" cy="13.8" r=".9"/>',
    car:     '<path d="M4 16.4v2.2h2.6v-2.2M17.4 16.4v2.2H20v-2.2"/><path d="M3.6 16.4v-4l1.9-4.6A2 2 0 0 1 7.4 6.6h9.2a2 2 0 0 1 1.9 1.2l1.9 4.6v4z"/><path d="M3.6 12.4h16.8"/><circle cx="7.4" cy="14.4" r=".9"/><circle cx="16.6" cy="14.4" r=".9"/>',
    star:    '<path d="M12 3.8l2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/>',
    fork:    '<path d="M6.5 3v6.5a2.5 2.5 0 0 0 5 0V3M9 9.5V21"/><path d="M17 21V3c-2 .8-2.8 3-2.8 5.6 0 1.8.9 2.8 2.8 3"/>',
    camera:  '<path d="M3.5 8.6a2 2 0 0 1 2-2h1.9l1.3-2.1h6.6l1.3 2.1h1.9a2 2 0 0 1 2 2v8.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.8" r="3.4"/>',
    heart:   '<path d="M12 20s-7.4-4.6-7.4-9.6A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.4 2.8c0 5-7.4 9.6-7.4 9.6z"/>',
    check:   '<path d="M4.5 12.5 9.5 17.5 19.5 6.5"/>',
    boat:    '<path d="M3.6 16.4h16.8l-1.9 3.2a2 2 0 0 1-1.7 1H7.2a2 2 0 0 1-1.7-1z"/><path d="M5.6 16.4V9.2l6.4-2.6 6.4 2.6v7.2M12 6.6V3.4"/>',
    lock:    '<rect x="4.6" y="10.4" width="14.8" height="9.6" rx="2.6"/><path d="M8.2 10.4V7.6a3.8 3.8 0 0 1 7.6 0v2.8"/>',
    pencil:  '<path d="M4 20h4.2L19 9.2a2.1 2.1 0 0 0 0-3l-1.2-1.2a2.1 2.1 0 0 0-3 0L4 15.8z"/><path d="M13.6 6.4 17.6 10.4"/>',
    trash:   '<path d="M4.5 6.6h15M9.6 6.6V4.8h4.8v1.8M6.6 6.6l.9 12.2a1.7 1.7 0 0 0 1.7 1.6h5.6a1.7 1.7 0 0 0 1.7-1.6l.9-12.2"/>',
    link:    '<path d="M10.2 13.8a3.6 3.6 0 0 0 5.4.4l2.6-2.6a3.6 3.6 0 0 0-5.1-5.1l-1.5 1.5"/><path d="M13.8 10.2a3.6 3.6 0 0 0-5.4-.4l-2.6 2.6a3.6 3.6 0 0 0 5.1 5.1l1.5-1.5"/>',
    plus:    '<path d="M12 5.2v13.6M5.2 12h13.6"/>'
  };
  function svg(name, cls){
    return '<svg viewBox="0 0 24 24"' + (cls ? ' class="' + cls + '"' : '') + '>' +
           ICON[name] + '</svg>';
  }

  /* Local-midnight date, so day maths never drifts by timezone. */
  function d(iso){ var p = iso.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function today(){ var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function daysBetween(a,b){ return Math.round((b - a) / 86400000); }

  function currentIndex(){
    var t = today();
    for (var i = 0; i < TRIP.days.length; i++){
      if (daysBetween(d(TRIP.days[i].iso), t) === 0) return i;
    }
    return null;
  }

  function greeting(){
    var h = new Date().getHours();
    return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  }

  /* ---------- who is holding this phone ---------- */

  function person(name){
    var list = (TRIP.people || []);
    for (var i = 0; i < list.length; i++){
      if (list[i].name === name || list[i].id === name) return list[i];
    }
    return null;
  }

  /* Index in TRIP.people decides filled vs outlined, so a person keeps the
     same mark everywhere regardless of who is looking. */
  function avi(name, cls){
    var p = person(name);
    if (!p) return '<span class="avi none' + (cls ? " " + cls : "") + '">?</span>';
    var alt = (TRIP.people.indexOf(p) % 2) === 1 ? " alt" : "";
    return '<span class="avi' + alt + (cls ? " " + cls : "") + '">' +
           esc(p.initial) + '</span>';
  }

  function byline(name){
    var p = person(name);
    return '<span class="byline">' + avi(name) +
           (p ? esc(p.name) : "added before names were on") + '</span>';
  }

  /* The greeting, and the way to change your mind about who you are. */
  function whoBlock(){
    var me = Store.who();
    if (!me){
      var h = '<div style="margin-bottom:4px"><h1 class="greet">Who&rsquo;s on this phone?</h1>' +
        '<p class="greet-sub">So the list can show who added what. ' +
        'You can switch any time.</p></div><div class="who-pick">';
      TRIP.people.forEach(function(p){
        h += '<button data-who="' + esc(p.name) + '">' + avi(p.name) +
             '<b>' + esc(p.name) + '</b></button>';
      });
      return h + '</div>';
    }
    return null;
  }

  /* Group icon for a ticket, so the list reads at a glance. */
  function ticketIcon(t){
    return t.group === "Flights" ? "plane"
         : t.group === "Rail" ? "train"
         : t.group === "Ground" ? "car"
         : t.group === "Dining" ? "fork" : "star";
  }

  /* ---------- shared blocks ---------- */
  /* ---------- colour + photography ---------- */

  /* Which of the five bases a day belongs to. Travel days key to where they
     start, which is why "Rome → Venice" reads as Rome. */
  function cityKey(day){
    var c = day.city;
    if (c.indexOf("Salt Lake") === 0) return "Home";
    if (c.indexOf("Rome") === 0) return "Rome";
    if (c.indexOf("Venice") === 0) return "Venice";
    if (c.indexOf("Lake Como") === 0) return "Lake Como";
    if (c.indexOf("Interlaken") === 0) return "Interlaken";
    if (c.indexOf("Paris") === 0) return "Paris";
    return "Home";
  }
  /* Tolerate a data.js that predates the palette. A service worker can serve a
     mixed set of files across a version bump, and a missing map must degrade to
     the mono design rather than throw and leave a blank screen. */
  function cityColor(name){
    var c = TRIP.cities && TRIP.cities[name];
    return c ? c.color : "#212529";
  }
  /* Inline custom properties: --accent tints the scrim and the accents,
     --bg-img points at the photograph. */
  function skin(cityName, imgKey){
    var s = '--accent:' + cityColor(cityName) + ';';
    if (imgKey) s += "--bg-img:url('img/" + imgKey + ".jpg');";
    return s;
  }
  function skinSq(cityName, imgKey){
    var s = '--accent:' + cityColor(cityName) + ';';
    if (imgKey) s += "--bg-img:url('img/" + imgKey + "-sq.jpg');";
    return s;
  }
  function dot(cityName){
    return '<span class="dot" style="--accent:' + cityColor(cityName) + '"></span>';
  }

  function pageHead(title, sub){
    return '<div style="margin-bottom:4px"><h1 class="greet">' + esc(title) + '</h1>' +
           (sub ? '<p class="greet-sub">' + esc(sub) + '</p>' : '') + '</div>';
  }

  function detailHead(back, title, sub){
    return '<div class="dhead">' +
      '<button class="circ" data-go="' + back + '" aria-label="Back">' + svg("chevL") + '</button>' +
      '<div class="mid"><b>' + esc(title) + '</b>' +
      (sub ? '<span>' + esc(sub) + '</span>' : '') + '</div>' +
      '<div class="spacer"></div></div>';
  }

  function sect(title, linkLabel, linkGo){
    return '<div class="sect"><h2>' + esc(title) + '</h2>' +
      (linkLabel ? '<button class="link" data-go="' + linkGo + '">' +
        esc(linkLabel) + '</button>' : '') + '</div>';
  }

  function note(text, kind, label){
    return '<div class="note' + (kind ? ' ' + kind : '') + '">' +
      (label ? '<span class="label">' + esc(label) + '</span>' : '') +
      esc(text) + '</div>';
  }

  function timelineBlock(day){
    if (!day.timeline || !day.timeline.length) return "";
    var h = '<ul class="tl">';
    day.timeline.forEach(function(s){
      h += '<li><div class="t">' + esc(s.t) + '</div><b>' + esc(s.what) + '</b>' +
           (s.detail ? '<span>' + esc(s.detail) + '</span>' : '') + '</li>';
    });
    return h + '</ul>';
  }

  function relatedTickets(day){
    var key = day.date.replace(/^\w+ /, "");
    return TRIP.tickets.filter(function(t){ return t.title.indexOf(key) !== -1; });
  }

  function ticketItem(t){
    return '<button class="item" data-go="#/ticket/' + t.id + '">' +
      '<div class="thumb dark">' + svg(ticketIcon(t)) + '</div>' +
      '<div class="txt"><b>' + esc(t.title) + '</b><em>' + esc(t.provider) +
      ' &middot; ' + esc(t.ref) + '</em></div>' +
      '<div class="go">' + svg("chevR") + '</div></button>';
  }

  /* What to call a day.

     Only travel days get a title, because only on a travel day does the title
     say something the date and the city do not — it is the route. Everywhere
     else the city IS the headline, and what is planned lives in the card you
     open rather than in a label that tries to summarise it. */
  function dayHeadline(day){
    return day.kind === "travel" && day.title ? day.title : "";
  }

  /* The headline, or the city when there is none. */
  function dayLead(day){
    return dayHeadline(day) || day.city;
  }

  /* Everything that is on for a day, in one block — used inside the accordion
     so the list answers "what are we doing" without opening the full page. */
  function dayInner(day){
    var h = "";
    if (day.summary) h += '<p class="lead">' + esc(day.summary) + '</p>';
    if (day.critical) h += note(day.critical, "alert", "Read this");
    h += timelineBlock(day);

    var rel = relatedTickets(day);
    if (rel.length){
      h += '<div class="mini-h">Tickets</div>';
      rel.forEach(function(t){ h += ticketItem(t); });
    }

    if (day.checklist && day.checklist.length){
      h += '<div class="mini-h">Before you go</div>';
      h += '<ul class="check">';
      day.checklist.forEach(function(c){ h += '<li>' + esc(c) + '</li>'; });
      h += '</ul>';
    }

    var booked = lockedFor(day);
    if (booked.length){
      h += '<div class="mini-h">Locked in</div>';
      booked.forEach(function(it){ h += wishMini(it); });
    }

    var ideas = ideasFor(day);
    if (ideas.length){
      h += '<div class="mini-h">Suggested for this day</div>';
      ideas.forEach(function(it){ h += wishMini(it); });
    }

    h += '<a class="btn-wide" data-go="#/day/' + day.n + '">Open day ' + day.n + '</a>';
    return h;
  }

  /* The Day-N accordion card, matching the tour-schedule pattern. */
  function dayAcc(day, open){
    var city = cityKey(day);
    return '<details class="acc"' + (open ? ' open' : '') +
      ' style="' + skin(city, null) + '">' +
      '<summary><div class="thumb pic" style="' + skinSq(city, day.img) + '">' +
      day.n + '</div>' +
      '<div class="txt"><span class="label">' + esc(day.date) + '</span>' +
      '<b>' + esc(dayLead(day)) + '</b>' +
      /* The city only appears underneath when the headline is a route, and
         only when it is not the same words again. */
      (dayHeadline(day) && dayHeadline(day) !== day.city
        ? '<em>' + esc(day.city) + '</em>' : '') +
      '</div>' +
      '<div class="chev">' + svg("chevD") + '</div></summary>' +
      '<div class="inner">' + dayInner(day) + '</div></details>';
  }

  /* ---------- views ---------- */
  var views = {};

  /* The greeting line, plus the tappable "not you?" switch underneath. */
  function todayHead(sub){
    var me = Store.who();
    return '<div style="margin-bottom:4px">' +
      '<h1 class="greet">' + esc(greeting() + ", " + me) + '</h1>' +
      '<p class="greet-sub">' + esc(sub) + '</p>' +
      '<button class="whoami" data-who-switch="1">' + avi(me) +
      '<span>Not ' + esc(me) + '? <u>Switch</u></span></button></div>';
  }

  views.today = function(){
    var idx = currentIndex();
    var h = "";

    /* Ask once, before anything else — the greeting and every byline need it. */
    var pick = whoBlock();
    if (pick) return pick;

    if (idx === null){
      var out = daysBetween(today(), d(TRIP.meta.start));
      if (out > 0){
        h += todayHead(TRIP.meta.travellers);
        h += '<div class="hero photo" style="margin-top:18px;' +
             skin("Rome", "rome-colosseum") + '">' +
             '<span class="label">Days until you fly</span>' +
             '<div class="count">' + out + '</div>' +
             '<p>Departing ' + esc(TRIP.days[0].date) + ' &middot; Rome first</p>' +
             '<button class="cta" data-go="#/day/1"><span>See day one</span><i>' +
             svg("arrowR") + '</i></button></div>';
        h += sect("The route", "All days", "#/days");
        h += routeStrip();
        h += sect("Still to sort", "See all", "#/open");
        TRIP.open.slice(0, 3).forEach(function(o){
          h += '<button class="item" data-go="#/open"><div class="thumb">' +
               svg("checks") + '</div><div class="txt"><b>' + esc(o.what) +
               '</b><em>' + esc(o.when) + '</em></div><div class="go">' +
               svg("chevR") + '</div></button>';
        });
        return h;
      }
      h += pageHead("Welcome home", "23 days, five cities");
      h += sect("The whole trip", null, null);

    shown.forEach(function(day, i){
      h += dayAcc(day, shown.length <= 6 && i === 0 ? false : false);

  views.day = function(n){

    /* Header carries the where/when; the hero below carries the what, so the
       two don't say the same thing twice. */

    /* Everything below inherits this city's accent — timeline times, field
       labels and rules all pick it up from --accent. */
    h += '<div style="' + skin(cityKey(day), null) + '">';

    h += '<div class="hero photo" style="' + skin(cityKey(day), day.img) + '">' +
         '<span class="label">Day ' + day.n + ' of 23</span>' +
         '<h1>' + esc(dayLead(day)) + '</h1>' +
         '<p>' + esc(day.date) +
         (dayHeadline(day) ? ' &middot; ' + esc(day.city) : '') + '</p>' +
         (day.high != null ? '<p style="margin-top:10px">High ' + day.high +
           '&deg; &middot; Low ' + day.low + '&deg; &middot; Rain ' +

    if (day.summary) h += '<div class="card"><p class="lead">' + esc(day.summary) + '</p></div>';

    /* Booked first, then merely wanted. The split is the whole point: one of

    var booked = lockedFor(day);

    var rel = relatedTickets(day);

      rel.forEach(function(t){ h += ticketItem(t); });
    }

    if (day.checklist && day.checklist.length){
      h += sect("Before you go", null, null);
      h += '<div class="card"><ul class="check">';

      h += '</ul></div>';

                    '">' + svg("chevL") + 'Day ' + TRIP.days[i-1].n + '</button>';

  /* ---------- wishlist ---------- */

  /* Pull a usable label out of a pasted link so a bare TikTok URL still reads
     as something in the list. Phrased as an action, because it is a button. */
  function linkCta(url){
    try {
      var h = new URL(url).hostname.replace(/^www\./, "");
      if (h.indexOf("tiktok") !== -1)    return "Watch on TikTok";
      if (h.indexOf("instagram") !== -1) return "Watch on Instagram";
      if (h.indexOf("youtu") !== -1)     return "Watch on YouTube";
      if (h.indexOf("maps") !== -1 || h.indexOf("google") !== -1 ||
          h.indexOf("goo.gl") !== -1) return "Open in Maps";
      return "Open " + h;
    } catch (e) { return "Open link"; }
  }

  /* The two links, as buttons. An item can carry the video or page it was
     spotted in AND a map link for where the place actually is — you see a
     TikTok of a viewpoint and want both. Side by side when there are two, full
     width when there is one. */
  function linkButtons(it){
    var a = "", b = "";
    if (it.url) {
      a = '<a class="src" href="' + escA(it.url) + '" target="_blank" ' +
          'rel="noopener">' + svg("link") + esc(linkCta(it.url)) + '</a>';
    }
    if (it.map) {
      b = '<a class="map" href="' + escA(it.map) + '" target="_blank" ' +
          'rel="noopener">' + svg("pin") + (a ? "Map" : "Open in Maps") + '</a>';
    }
    if (a && b) return '<div class="links">' + a + b + '</div>';
    return a || b;
  }

  /* ---------- suggesting a day ---------- */

  /* Which days a thing could plausibly happen on. A city narrows it to that
     city's days; "Other" (no city) leaves every day open, because a phrase to
     learn or a thing to buy is not tied to a place. */
  function daysForCity(city){
    return TRIP.days.filter(function(d){
      return !city || cityKey(d) === city;
    });
  }

  function dayOptions(city, selected){
    var h = '<option value="">No day yet</option>';
    daysForCity(city).forEach(function(d){
      h += '<option value="' + d.n + '"' +
           (String(selected || "") === String(d.n) ? " selected" : "") + '>' +
           'Day ' + d.n + ' — ' + esc(d.date) + ' — ' + esc(d.city) +
           '</option>';
    });
    return h;
  }

  /* A suggestion is a hint, not a booking — the wording stays soft on purpose. */
  function dayHint(n){
    var d = null;
    TRIP.days.forEach(function(x){ if (String(x.n) === String(n)) d = x; });
    return d ? 'Day ' + d.n + ' &middot; ' + esc(d.date) : "";
  }

  /* Locked in = booked for a specific day, as opposed to merely suggested for
     it. A lock without a day is meaningless, so both are required. */
  function isLocked(it){
    return it.locked === true && !!it.day;
  }

  /* Which item, if any, is currently open for editing. Cleared on navigation
     so a half-finished edit cannot survive a route change. */
  var editingId = null;

  /* The add form starts collapsed. It is five fields tall, and the list is
     what you open this tab to read — adding is the rarer act. */
  var addOpen = false;

  /* ---------- the add / edit form ----------
     One function for both, because they are the same fields. Passing an item
     makes it an edit; passing nothing makes it the add form at the top of the
     list. The two use different id prefixes so both can exist at once. */
  function wishForm(it){
    var e = !!it, p = e ? "ed" : "wl", v = it || {};
    var city = v.city || "";
    var h = '<div class="wl-form"' + (e ? ' style="margin-bottom:14px"' : '') + '>';
    h += '<label for="' + p + 'Title">What is it</label>' +
      '<input id="' + p + 'Title" type="text" value="' + escA(v.title || "") + '" ' +
        'placeholder="Trevi Fountain at dawn" autocomplete="off" enterkeyhint="done">';
    h += '<label for="' + p + 'Url">Link — TikTok, Reel, or any site</label>' +
      '<input id="' + p + 'Url" type="url" value="' + escA(v.url || "") + '" ' +
        'placeholder="https://" autocomplete="off" inputmode="url" enterkeyhint="done">';
    h += '<label for="' + p + 'Map">Map link — where it is</label>' +
      '<input id="' + p + 'Map" type="url" value="' + escA(v.map || "") + '" ' +
        'placeholder="https://maps.google.com/…" autocomplete="off" ' +
        'inputmode="url" enterkeyhint="done">';
    h += '<label for="' + p + 'City">Where</label>' +
      '<select id="' + p + 'City" data-city-sel="' + p + 'Day">' +
        '<option value="">Other — not tied to a place</option>' +
        Object.keys(TRIP.cities).map(function(c){
          return '<option value="' + escA(c) + '"' +
                 (c === city ? " selected" : "") + '>' + esc(c) + '</option>';
        }).join("") +
      '</select>';
    h += '<label for="' + p + 'Day">Suggest a day</label>' +
      '<select id="' + p + 'Day">' + dayOptions(city, v.day) + '</select>';
    /* Locking without a day is meaningless, so the checkbox says so rather
       than silently doing nothing. */
    h += '<div class="lockrow"><input type="checkbox" id="' + p + 'Lock"' +
      (v.locked ? " checked" : "") + '>' +
      '<span>Lock it in<em>It is booked, not just an idea. Needs a day.</em></span>' +
      '</div>';
    h += '<label for="' + p + 'Note">Note</label>' +
      '<textarea id="' + p + 'Note" placeholder="Optional — why, or what to know">' +
      esc(v.note || "") + '</textarea>';
    if (e){
      h += '<div class="row">' +
        '<button class="ghost" id="edCancel">Cancel</button>' +
        '<button id="edSave" data-id="' + escA(v.id) + '">Save</button></div>';
    } else {
      h += '<button class="btn-wide" id="wlAdd" style="margin-top:4px">Add it</button>';
    }
    return h + '</div>';
  }

  function wishRow(it){
    if (it.id === editingId) return wishForm(it);

    var city = it.city && TRIP.cities[it.city] ? it.city : null;
    var accent = city ? cityColor(city) : "#212529";
    var lok = isLocked(it);
    var h = '<div class="wl' + (lok ? " lok" : "") +
            '" style="--accent:' + accent + '">';
    h += '<div class="acts">' +
      '<button data-wl-edit="' + escA(it.id) + '" aria-label="Edit">' +
        svg("pencil") + '</button>' +
      '<button data-wl-del="' + escA(it.id) + '" aria-label="Delete">' +
        svg("trash") + '</button></div>';
    h += '<div class="body">';
    if (lok) h += '<div class="locktag">' + svg("lock") + 'Locked in &middot; ' +
                  dayHint(it.day) + '</div>';
    h += '<b>' + esc(it.title) + '</b>';
    h += '<div class="meta">' + byline(it.createdBy) + ' &middot; ' +
         (city ? dot(city) + esc(city) : "Other") +
         (!lok && it.day && dayHint(it.day) ? ' &middot; ' + dayHint(it.day) : "") +
         '</div>';
    if (it.note) h += '<p class="note">' + esc(it.note) + '</p>';
    h += linkButtons(it);
    h += '</div>';
    return h + '</div>';
  }

  /* A read-only version of a row, for the day accordion. No edit or delete:
     those re-render, which would collapse the accordion mid-action. Editing
     happens on the day page or the Want-to-do tab. */
  function wishMini(it){
    var city = it.city && TRIP.cities[it.city] ? it.city : null;
    var accent = city ? cityColor(city) : "#212529";
    var h = '<div class="wm" style="--accent:' + accent + '">';
    if (isLocked(it)) h += '<div class="locktag">' + svg("lock") + 'Locked in</div>';
    h += '<b>' + esc(it.title) + '</b>';
    h += '<div class="meta">' + byline(it.createdBy) + '</div>';
    if (it.note) h += '<p class="note">' + esc(it.note) + '</p>';
    h += linkButtons(it);
    return h + '</div>';
  }

  /* Everything pinned to one day, split by whether it is booked. */
  function forDay(day){
    return Store.items().filter(function(x){
      return String(x.day || "") === String(day.n);
    });
  }
  function lockedFor(day){ return forDay(day).filter(isLocked); }
  /* Suggestions only — the locked ones are listed separately above them. */
  function ideasFor(day){
    return forDay(day).filter(function(x){ return !isLocked(x); });
  }

  views.wish = function(filter){
    var pick = whoBlock();
    if (pick) return pick;

    var all = Store.items();
    var st = Store.status();
    var active = filter ? decodeURIComponent(filter) : "All";

    var h = pageHead("Want to do", "Anything either of you spots — it does not have to be scheduled");

    /* Only worth showing once there is something to filter. */
    if (all.length > 1){
      h += '<div class="chips" style="margin-top:16px">';
      ["All"].concat(TRIP.people.map(function(p){ return p.name; })).forEach(function(c){
        h += '<button class="chip" aria-pressed="' + (c === active) +
             '" data-go="#/wish/' + encodeURIComponent(c) + '">' +
             (c === "All" ? "" : avi(c) + " ") + esc(c) + '</button>';
      });
      h += '</div>';
    }

    var list = all.filter(function(x){
      return active === "All" || (x.createdBy || "") === active;
    });

    h += '<div style="margin-top:18px">';
    if (addOpen){
      h += wishForm(null);
    } else {
      h += '<button class="btn-wide" id="wlOpen">' + svg("plus") +
           ' Add something</button>';
    }
    h += '</div>';

    if (!list.length){
      h += '<div class="card"><div class="empty">' +
           (all.length ? 'Nothing from ' + esc(active) + ' yet.'
                       : 'Nothing on the list yet.<br>Add the first thing either of you wants to see.') +
           '</div></div>';
    } else {
      /* Booked things float to the top and sort by day — that list is a
         schedule, so date order is the only order that makes sense. */
      var booked = list.filter(isLocked).sort(function(a, b){
        return (+a.day || 0) - (+b.day || 0);
      });
      var rest = list.filter(function(x){ return !isLocked(x); });

      if (booked.length){
        h += sect("Locked in", null, null);
        booked.forEach(function(it){ h += wishRow(it); });
      }
      if (rest.length){
        h += sect(booked.length ? "Ideas" : "On the list", null, null);
        rest.forEach(function(it){ h += wishRow(it); });
      }
    }

    h += '<div class="sync">Saved <b>' + esc(st.mode) + '</b>' +
         (st.pending ? ' &middot; ' + st.pending + ' waiting to sync' : '') +
         ' &middot; adding as <b>' + esc(Store.who()) + '</b></div>';
    return h;
  };

  /* ---------- map ----------
     Everything on the list that has coordinates, plus the five stays, drawn on
     one map. Coordinates are stored on the item (geocoded once when it was
     created) so the markers draw with no network; only the tile images need a
     connection, and the service worker keeps the ones you have already looked
     at. */

  var MAP = null, MAP_LAYER = null, MAP_ME = null, MAP_WATCH = null;
  var mapCity = "All";
  var showTransit = true;
  var myPos = null;      /* {lat, lng} once geolocation answers */

  /* Great-circle distance in km. */
  function distKm(a, b){
    var R = 6371, toR = Math.PI / 180;
    var dLat = (b.lat - a.lat) * toR, dLng = (b.lng - a.lng) * toR;
    var la1 = a.lat * toR, la2 = b.lat * toR;
    var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.sin(dLng / 2) * Math.sin(dLng / 2) * Math.cos(la1) * Math.cos(la2);
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  function prettyDist(km){
    if (km == null) return "";
    if (km < 1) return Math.round(km * 1000) + " m";
    if (km < 10) return km.toFixed(1) + " km";
    return Math.round(km) + " km";
  }

  /* What the distances are measured from: you, if the phone will say, else the
     place you are sleeping in that city. */
  function originFor(city){
    if (myPos) return myPos;
    var st = null;
    TRIP.stays.forEach(function(x){ if (x.city === city && x.lat) st = x; });
    if (st) return { lat: st.lat, lng: st.lng };
    return null;
  }

  function mapPoints(){
    var pts = [];
    Store.items().forEach(function(it){
      if (typeof it.lat !== "number" || typeof it.lng !== "number") return;
      if (mapCity !== "All" && (it.city || "") !== mapCity) return;
      pts.push({ kind: "item", it: it, lat: it.lat, lng: it.lng,
                 city: it.city || "", title: it.title });
    });
    TRIP.stays.forEach(function(st){
      if (!st.lat) return;
      if (mapCity !== "All" && st.city !== mapCity) return;
      pts.push({ kind: "stay", st: st, lat: st.lat, lng: st.lng,
                 city: st.city, title: st.name });
    });
    if (showTransit && TRIP.transit){
      TRIP.transit.forEach(function(tp){
        /* A transit point with no city sits too far from any one base to
           belong on that city's map — Basel is not Interlaken. */
        if (mapCity !== "All" && tp.city !== mapCity) return;
        pts.push({ kind: "transit", tp: tp, lat: tp.lat, lng: tp.lng,
                   city: tp.city, title: tp.name });
      });
    }
    return pts;
  }

  function transitIcon(kind){
    return kind === "air" ? "plane" : kind === "boat" ? "boat" : "train";
  }

  function markerHtml(p){
    var col = p.city && TRIP.cities[p.city] ? cityColor(p.city) : "#212529";
    if (p.kind === "stay"){
      return '<div class="mk-wrap"><div class="mk big" style="--mk:' + col +
             '">' + svg("home") + '</div></div>';
    }
    if (p.kind === "transit"){
      return '<div class="mk-wrap"><div class="mk tr">' +
             svg(transitIcon(p.tp.kind)) + '</div></div>';
    }
    var lok = isLocked(p.it);
    return '<div class="mk-wrap"><div class="mk' + (lok ? " lok" : "") +
           '" style="--mk:' + col + '">' + (lok ? svg("lock") : "") + '</div></div>';
  }

  function popupHtml(p){
    var h = "";
    if (p.kind === "stay"){
      h += '<b>' + esc(p.st.name) + '</b>' +
           '<div class="pm">Where you sleep &middot; ' + esc(p.st.city) + '</div>' +
           '<div class="pm">' + esc(p.st.addr) + '</div>';
      h += '<a href="#/stays" data-go="#/stays">Open Stays &rarr;</a>';
      return h;
    }
    if (p.kind === "transit"){
      var tp = p.tp;
      h += '<b>' + esc(tp.name) + '</b>' +
           '<div class="pm">' +
           (tp.kind === "air" ? "Airport" : tp.kind === "boat" ? "Pier" : "Station") +
           (tp.city ? ' &middot; ' + esc(tp.city) : '') + '</div>' +
           '<div class="pm">' + esc(tp.when) + '</div>';
      var ot = originFor(tp.city);
      if (ot) h += '<div class="pm">' +
                   prettyDist(distKm(ot, { lat: tp.lat, lng: tp.lng })) +
                   (myPos ? " from you" : " from your place") + '</div>';
      return h;
    }
    var it = p.it;
    h += '<b>' + esc(it.title) + '</b><div class="pm">' +
         (isLocked(it) ? "Locked in &middot; " + dayHint(it.day) + " &middot; " : "") +
         esc(it.city || "Other") + '</div>';
    var o = originFor(it.city);
    if (o) h += '<div class="pm">' + prettyDist(distKm(o, { lat: it.lat, lng: it.lng })) +
                (myPos ? " from you" : " from your place") + '</div>';
    /* Both links when the item has both: the pin is where it is, the video is
       why it made the list. Same order as the list cards — video first, map second. */
    if (it.url) h += '<a href="' + escA(it.url) + '" target="_blank" rel="noopener">' +
                     esc(linkCta(it.url)) + ' &rarr;</a>';
    if (it.map) h += '<a href="' + escA(it.map) + '" target="_blank" rel="noopener">Open in Maps &rarr;</a>';
    return h;
  }

  function drawMap(){
    if (!window.L || !el("map")) return;
    if (!MAP){
      MAP = L.map("map", { zoomControl: true, attributionControl: true });
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, crossOrigin: true,
        attribution: '&copy; OpenStreetMap',
      }).addTo(MAP);
      MAP.setView([46.5, 8.5], 5);
    }
    if (MAP_LAYER) MAP_LAYER.remove();
    MAP_LAYER = L.layerGroup().addTo(MAP);

    var pts = mapPoints(), bounds = [];
    pts.forEach(function(p){
      var m = L.marker([p.lat, p.lng], {
        icon: L.divIcon({ html: markerHtml(p), className: "",
                          iconSize: [30, 30], iconAnchor: [15, 15] }),
        title: p.title,
      });
      m.bindPopup(popupHtml(p));
      m.addTo(MAP_LAYER);
      bounds.push([p.lat, p.lng]);
    });
    if (myPos){
      L.marker([myPos.lat, myPos.lng], {
        icon: L.divIcon({ html: '<div class="mk-wrap"><div class="mk me"></div></div>',
                          className: "", iconSize: [22, 22], iconAnchor: [11, 11] }),
        title: "You",
      }).addTo(MAP_LAYER).bindPopup("<b>You are here</b>");
      bounds.push([myPos.lat, myPos.lng]);
    }
    if (bounds.length){
      MAP.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
    }
    /* Leaflet measures its container on creation; inside a freshly-written
       innerHTML that measurement is stale, so force it after layout. */
    setTimeout(function(){ if (MAP) MAP.invalidateSize(); }, 60);
  }

  function locateMe(){
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function(pos){
      myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if ((location.hash || "").indexOf("#/map") === 0) rerender();
    }, function(){ /* refused or unavailable — fall back to the stay */ },
    { enableHighAccuracy: false, timeout: 8000, maximumAge: 300000 });
  }

  views.map = function(){
    var pick = whoBlock();
    if (pick) return pick;

    var h = pageHead("Map", "Everything on the list, and where you sleep");

    var cities = ["All"].concat(Object.keys(TRIP.cities).filter(function(c){
      return c !== "Home";
    }));
    h += '<div class="chips" style="margin-top:16px">';
    cities.forEach(function(c){
      h += '<button class="chip" aria-pressed="' + (c === mapCity) +
           '" data-mapcity="' + escA(c) + '">' +
           (c === "All" ? "" : dot(c)) + esc(c) + '</button>';
    });
    h += '</div>';

    h += '<div class="chips" style="margin-top:8px">' +
      '<button class="chip" aria-pressed="' + showTransit + '" data-maptransit="1">' +
      svg("train") + ' Stations &amp; airports</button></div>';

    h += '<div id="mapwrap"><div id="map"></div></div>';

    h += '<div class="mapbar">' +
      '<button class="btn-wide" id="mapLocate">' + svg("pin") +
      (myPos ? " Recentre on you" : " Show where I am") + '</button></div>';

    /* The list under the map is the offline answer: with no tiles you still
       get every place, sorted by how far away it is. */
    var pts = mapPoints();
    var withDist = pts.map(function(p){
      /* A stay measured from itself is always "0 m", which is noise. Give it a
         distance only when it is measured from where you actually are. */
      var o = (p.kind === "stay" && !myPos) ? null : originFor(p.city);
      p.km = o ? distKm(o, { lat: p.lat, lng: p.lng }) : null;
      return p;
    }).sort(function(a, b){
      if (a.km == null) return 1;
      if (b.km == null) return -1;
      return a.km - b.km;
    });

    if (!withDist.length){
      h += '<div class="card"><div class="empty">Nothing here yet.</div></div>';
    } else {
      h += sect(myPos ? "Nearest to you" : "By distance from your place", null, null);
      h += '<div class="maplist">';
      withDist.forEach(function(p, i){
        var col = p.kind === "transit" ? "#5a6572"
                : (p.city && TRIP.cities[p.city] ? cityColor(p.city) : "#212529");
        h += '<button class="maprow" data-mapgo="' + i + '" style="--accent:' + col + '">' +
          '<span class="pip"></span>' +
          '<span class="txt"><b>' + esc(p.title) + '</b><em>' +
          (p.kind === "stay" ? "Where you sleep &middot; " :
           p.kind === "transit"
             ? (p.tp.kind === "air" ? "Airport" : p.tp.kind === "boat" ? "Pier" : "Station") + " &middot; "
             : "") +
          esc(p.city || (p.kind === "transit" ? "En route" : "Other")) + '</em></span>' +
          '<span class="dist">' +
          (p.km == null ? '<span style="color:var(--faint)">&mdash;</span>'
                        : prettyDist(p.km)) + '</span></button>';
      });
      h += '</div>';
    }

    var noCoords = Store.items().filter(function(it){
      return typeof it.lat !== "number";
    }).length;
    if (noCoords) h += '<p class="lead" style="font-size:13px;margin-top:12px">' +
      noCoords + (noCoords === 1 ? ' item has' : ' items have') +
      ' no location yet, so ' + (noCoords === 1 ? 'it is' : 'they are') +
      ' not on the map.</p>';

    h += '<p class="lead" style="font-size:12.5px;margin-top:14px">' +
      'Map tiles need a signal. The pins, distances and this list all work ' +
      'offline &mdash; and tiles you have already looked at stay cached.</p>';

    MAP_PTS = withDist;
    return h;
  };

  var MAP_PTS = [];

  views.sos = function(){
    var em = TRIP.emergency;
    var h = detailHead("#/today", "Emergency", "Tap any number to call");

    h += '<a class="hero" href="tel:112" style="display:block;text-decoration:none">' +
         '<span class="label">Anywhere in Europe</span>' +
         '<div class="count">112</div>' +
         '<p>' + esc(em.universal.note) + '</p></a>';

    em.byCountry.forEach(function(c){
      h += sect(c.country, null, null);
      h += '<div class="card pad-sm">';
      c.items.forEach(function(it){
        h += '<div class="kv"><div class="k">' + esc(it[0]) + '</div>' +
             '<div class="v"><a href="tel:' + esc(it[1]) +
             '" class="mono" style="font-size:19px;font-weight:700;text-decoration:none">' +
             esc(it[1]) + '</a></div></div>';
      });
      h += '</div>';
    });

    h += sect("Numbers you may need", null, null);
    h += '<div class="card pad-sm">';
    em.keyNumbers.forEach(function(k){
      h += '<div class="kv"><div class="k">' + esc(k.label) + '</div>' +
           '<div class="v"><a href="tel:' + esc(k.value.replace(/\s/g,"")) + '">' +
           esc(k.value) + '</a></div></div>';
    });
    h += '</div>';

    h += sect("Us", null, null);
    h += '<div class="card pad-sm">';
    em.us.forEach(function(u){
      h += '<div class="kv"><div class="k">' + esc(u.label) + '</div><div class="v">' +
           (u.value ? '<a href="tel:' + esc(u.value.replace(/\s/g,"")) + '">' +
             esc(u.value) + '</a>' : '<span style="color:var(--faint)">not filled in</span>') +
           '</div></div>';
    });
    h += '</div>';

    h += note(em.warn, "alert", "Before you fly");
    h += '<p class="lead" style="font-size:13px">Embassy numbers are deliberately not ' +
         'listed &mdash; a wrong emergency number is worse than none. Fill them from ' +
         'travel.state.gov before you go.</p>';
    return h;
  };

  /* ---------- nav ---------- */
  var TABS = [
    { id:"today",   icon:"home",   label:"Today" },
    { id:"days",    icon:"cal",    label:"Days" },
    { id:"tickets", icon:"ticket", label:"Tickets" },
    { id:"wish",    icon:"heart",  label:"Want to do" },
    { id:"stays",   icon:"bed",    label:"Stays" },
    { id:"map",     icon:"pin",    label:"Map" },
    { id:"open",    icon:"checks", label:"Open" },
  ];

  function renderTabs(active){
    var h = "";
    TABS.forEach(function(t){
      h += '<button data-go="#/' + t.id + '" aria-current="' + (t.id === active) +
           '" aria-label="' + t.label + '">' + svg(t.icon) + '</button>';
    });
    el("tabs").innerHTML = h;
  }

  /* ---------- router ---------- */
  function route(){
    var hash = location.hash || "#/today";
    var parts = hash.replace(/^#\//, "").split("/");
    var view = parts[0] || "today";
    var arg = parts[1];

    var html, tab = view;
    if (view === "day"){ html = views.day(arg); tab = "days"; }
    else if (view === "days"){ html = views.days(arg); }
    else if (view === "wish"){ html = views.wish(arg); }
    else if (view === "map"){ html = views.map(); }
    else if (view === "ticket"){ html = views.ticket(arg); tab = "tickets"; }
    else if (views[view]){ html = views[view](); }
    else { html = views.today(); tab = "today"; }

    el("app").innerHTML = html;
    renderTabs(tab);
    /* The map must be built after its container is in the document, and the
       old instance is dead once innerHTML was replaced. */
    if (view === "map"){ MAP = null; drawMap(); }
    window.scrollTo(0, 0);
  }

  /* Re-draw in place. route() jumps to the top, which is right for navigation
     and wrong for editing the eleventh item on a long list. */
  function rerender(){
    var y = window.scrollY;
    route();
    window.scrollTo(0, y);
  }

  /* Changing the city rewrites the day picker beside it, so the days offered
     are only that city's. Done in place rather than by re-rendering, because a
     re-render would throw away whatever is half-typed in the other fields. */
  document.addEventListener("change", function(e){
    var sel = e.target.closest("[data-city-sel]");
    if (!sel) return;
    var days = el(sel.getAttribute("data-city-sel"));
    if (days) days.innerHTML = dayOptions(sel.value, days.value);
  });

  /* One delegated handler for navigation and for the wishlist controls, since
     both live in markup that gets replaced wholesale on every render. */
  document.addEventListener("click", function(e){
    var pickWho = e.target.closest("[data-who]");
    if (pickWho){
      e.preventDefault();
      Store.setWho(pickWho.getAttribute("data-who"));
      route();
      return;
    }

    /* Switch cycles rather than opening a dialog — there are two of you. */
    var swap = e.target.closest("[data-who-switch]");
    if (swap){
      e.preventDefault();
      var names = TRIP.people.map(function(p){ return p.name; });
      var at = names.indexOf(Store.who());
      Store.setWho(names[(at + 1) % names.length]);
      route();
      return;
    }

    var mc = e.target.closest("[data-mapcity]");
    if (mc){
      e.preventDefault();
      mapCity = mc.getAttribute("data-mapcity");
      rerender();
      return;
    }

    var mt = e.target.closest("[data-maptransit]");
    if (mt){
      e.preventDefault();
      showTransit = !showTransit;
      rerender();
      return;
    }

    var mrow = e.target.closest("[data-mapgo]");
    if (mrow){
      e.preventDefault();
      var p = MAP_PTS[+mrow.getAttribute("data-mapgo")];
      if (p && MAP){
        MAP.setView([p.lat, p.lng], 16, { animate: true });
        el("mapwrap").scrollIntoView({ behavior: "smooth", block: "center" });
        MAP_LAYER.eachLayer(function(l){
          var ll = l.getLatLng && l.getLatLng();
          if (ll && Math.abs(ll.lat - p.lat) < 1e-9 && Math.abs(ll.lng - p.lng) < 1e-9) {
            l.openPopup();
          }
        });
      }
      return;
    }

    var loc = e.target.closest("#mapLocate");
    if (loc){
      e.preventDefault();
      locateMe();
      return;
    }

    var opn = e.target.closest("#wlOpen");
    if (opn){
      e.preventDefault();
      addOpen = true;
      rerender();
      var f = el("wlTitle");
      if (f) f.focus();
      return;
    }

    var add = e.target.closest("#wlAdd");
    if (add){
      e.preventDefault();
      var title = el("wlTitle").value.trim();
      if (!title){ el("wlTitle").focus(); return; }
      Store.add({
        title: title,
        url:   el("wlUrl").value.trim(),
        map:   el("wlMap").value.trim(),
        city:  el("wlCity").value,
        day:   el("wlDay").value,
        note:  el("wlNote").value.trim(),
        locked: el("wlLock").checked && !!el("wlDay").value,
      });
      addOpen = false;
      route();
      return;
    }

    var ed = e.target.closest("[data-wl-edit]");
    if (ed){
      e.preventDefault();
      editingId = ed.getAttribute("data-wl-edit");
      rerender();
      return;
    }

    var cancel = e.target.closest("#edCancel");
    if (cancel){
      e.preventDefault();
      editingId = null;
      rerender();
      return;
    }

    var save = e.target.closest("#edSave");
    if (save){
      e.preventDefault();
      var t = el("edTitle").value.trim();
      if (!t){ el("edTitle").focus(); return; }
      Store.update(save.getAttribute("data-id"), {
        title: t,
        url:   el("edUrl").value.trim(),
        map:   el("edMap").value.trim(),
        city:  el("edCity").value,
        day:   el("edDay").value,
        note:  el("edNote").value.trim(),
        locked: el("edLock").checked && !!el("edDay").value,
      });
      editingId = null;
      rerender();
      return;
    }

    var del = e.target.closest("[data-wl-del]");
    if (del){
      e.preventDefault();
      Store.remove(del.getAttribute("data-wl-del"));
      editingId = null;
      rerender();
      return;
    }

    /* Anchors that carry data-go are internal too, so stop them following
       their href. */
    var target = e.target.closest("[data-go]");
    if (!target) return;
    e.preventDefault();
    location.hash = target.getAttribute("data-go");
  });

  /* Enter in either text field adds the item. */
  document.addEventListener("keydown", function(e){
    if (e.key !== "Enter") return;
    if (e.target.id === "wlTitle" || e.target.id === "wlUrl"){
      e.preventDefault();
      var b = el("wlAdd");
      if (b) b.click();
    }
  });

  /* A share handed to us by the OS. Android/Chrome routes the system share
     sheet here via the manifest's share_target; iOS has no such API, so on an
     iPhone the equivalent is a Shortcut posting straight to the endpoint.
     Either way the same URL shape works, so it doubles as a bookmarklet. */
  function consumeShare(){
    var q = new URLSearchParams(location.search);
    var url = (q.get("url") || "").trim();
    var text = (q.get("text") || "").trim();
    var title = (q.get("title") || "").trim();
    if (!url && !text && !title) return false;

    /* Android often puts the link inside `text` rather than `url`. */
    if (!url){
      var m = text.match(/https?:\/\/\S+/);
      if (m){ url = m[0]; text = text.replace(m[0], "").trim(); }
    }
    if (!url && !title && !text) return false;

    Store.add({
      title: title || text || "Shared link",
      url: url, map: "", city: "",
      note: title && text && title !== text ? text : "",
      done: false,
    });

    /* Drop the query string so a reload cannot add the same thing twice. */
    try {
      history.replaceState(null, "", location.pathname + "#/wish");
    } catch (e) { location.hash = "#/wish"; }
    location.hash = "#/wish";
    return true;
  }

  window.addEventListener("hashchange", function(){
    editingId = null; addOpen = false; route();
  });
  consumeShare();
  route();

  /* Pull the shared list once at launch, and again whenever the app comes back
     to the foreground — that is when the other phone's additions arrive. */
  function sync(){
    Store.refresh().then(function(){
      /* Never redraw over a half-finished edit. Day pages list suggestions
         too, so they refresh on the same signal. */
      var at = location.hash || "";
      if (!editingId && (at.indexOf("#/wish") === 0 || at.indexOf("#/day") === 0)) {
        rerender();
      }
    });
  }
  sync();
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden) sync();
  });

  var sos = document.createElement("button");
  sos.className = "sos";
  sos.textContent = "SOS";
  sos.setAttribute("data-go", "#/sos");
  sos.setAttribute("aria-label", "Emergency numbers");
  document.body.appendChild(sos);

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){ /* offline is best-effort */ });
    });
  }
})();
</script>
</body>
</html>
